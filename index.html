    <script>

/*
 * =====================================================
 * REGISTER SERVICE WORKER
 *
 * This must happen before the page attempts to cache
 * audio files for offline playback.
 * =====================================================
 */

if ("serviceWorker" in navigator) {

    navigator.serviceWorker
        .register("./service-worker.js")
        .then(registration => {

            console.log(
                "Service worker registered:",
                registration.scope
            );

        })
        .catch(error => {

            console.error(
                "Service worker registration failed:",
                error
            );

        });
}

        /*
         * =====================================================
         * FULL MOBILE GESTURE PREVENTION
         * =====================================================
         */

        let lastTouchEnd = 0;

        document.addEventListener(
            "touchend",
            event => {

                const now =
                    Date.now();

                if (
                    now - lastTouchEnd <= 300
                ) {

                    event.preventDefault();
                }

                lastTouchEnd =
                    now;

            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturestart",
            event => {

                event.preventDefault();

            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturechange",
            event => {

                event.preventDefault();

            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gestureend",
            event => {

                event.preventDefault();

            },
            {
                passive: false
            }
        );

        /*
         * =====================================================
         * ELEMENTS
         * =====================================================
         */

        const musicAudio =
            document.getElementById(
                "musicAudio"
            );

        const speechAudio =
            document.getElementById(
                "speechAudio"
            );

        const playButton =
            document.getElementById(
                "playButton"
            );

        const songNameElement =
            document.getElementById(
                "songName"
            );

        const upNextElement =
            document.getElementById(
                "upNext"
            );

        const countdownElement =
            document.getElementById(
                "countdown"
            );

        /*
         * =====================================================
         * RADIO CONFIGURATION
         * =====================================================
         */

        const RADIO_START =
            new Date(
                "Dec 1, 2025 00:00:00"
            ).getTime();

        const SONG_FOLDER =
            "./songs/";

        const SPEECH_SRC =
            "./songs/speech.mp3";

        const DURATION_MANIFEST =
            "./songs/durations.json";

        const SONGS_PER_SPEECH =
            4;

        /*
         * =====================================================
         * STATE
         * =====================================================
         */

        let songs = [];

        let speechDuration = 0;

        let totalPlaylistDuration = 0;

        let metadataLoaded = false;

        let metadataLoadingPromise = null;

        let radioPlaying = false;

        let currentSongIndex = 0;

        let currentSegmentType = "song";

        let isChangingTrack = false;

        /*
         * =====================================================
         * FORMAT TIME
         * =====================================================
         */

        function formatTime(seconds) {

            if (
                !Number.isFinite(
                    seconds
                )
            ) {

                return "0:00";
            }

            seconds =
                Math.max(
                    0,
                    Math.floor(
                        seconds
                    )
                );

            const minutes =
                Math.floor(
                    seconds / 60
                );

            const secs =
                String(
                    seconds % 60
                ).padStart(
                    2,
                    "0"
                );

            return `${minutes}:${secs}`;
        }

        /*
         * =====================================================
         * CHRISTMAS COUNTDOWN
         * =====================================================
         */

        function updateCountdown() {

            const now =
                new Date();

            let christmas =
                new Date(
                    now.getFullYear(),
                    11,
                    25,
                    0,
                    0,
                    0,
                    0
                );

            if (
                now >= christmas
            ) {

                christmas =
                    new Date(
                        now.getFullYear() + 1,
                        11,
                        25,
                        0,
                        0,
                        0,
                        0
                    );
            }

            const seconds =
                Math.floor(
                    (
                        christmas - now
                    ) / 1000
                );

            const days =
                Math.floor(
                    seconds / 86400
                );

            const hours =
                Math.floor(
                    (
                        seconds % 86400
                    ) / 3600
                );

            const minutes =
                Math.floor(
                    (
                        seconds % 3600
                    ) / 60
                );

            const secs =
                seconds % 60;

            countdownElement.textContent =
                `${days}d ${hours}h ${minutes}m ${secs}s`;
        }

        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );

        /*
         * =====================================================
         * SNOW
         * =====================================================
         */

        function setSnowDrift(
            snowflake,
            driftAmount
        ) {

            const center =
                (
                    Math.random() - 0.5
                ) *
                driftAmount;

            const swing =
                8 +
                Math.random() *
                (
                    driftAmount *
                    0.55
                );

            const direction =
                Math.random() > 0.5
                    ? 1
                    : -1;

            snowflake.style.setProperty(
                "--drift-start",
                `${center - swing * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-one",
                `${center + swing * 0.25 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-two",
                `${center + swing * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-three",
                `${center + swing * 0.35 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-four",
                `${center - swing * 0.45 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-five",
                `${center - swing * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-six",
                `${center - swing * 0.30 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-seven",
                `${center + swing * 0.55 * direction}px`
            );

            snowflake.style.setProperty(
                "--drift-end",
                `${center + swing * 0.15 * direction}px`
            );
        }

        function createSnowflakes(
            container,
            amount
        ) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const snowflake =
                    document.createElement(
                        "div"
                    );

                snowflake.className =
                    "snowflake";

                snowflake.textContent =
                    Math.random() > 0.5
                        ? "❄"
                        : "•";

                snowflake.style.left =
                    `${Math.random() * 100}%`;

                snowflake.style.setProperty(
                    "--size",
                    `${8 + Math.random() * 14}px`
                );

                snowflake.style.setProperty(
                    "--opacity",
                    `${0.25 + Math.random() * 0.65}`
                );

                snowflake.style.setProperty(
                    "--duration",
                    `${7 + Math.random() * 12}s`
                );

                snowflake.style.setProperty(
                    "--delay",
                    `${-Math.random() * 15}s`
                );

                setSnowDrift(
                    snowflake,
                    50
                );

                container.appendChild(
                    snowflake
                );
            }
        }

        function createCircleSnow(
            container,
            amount,
            depth
        ) {

            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const snowflake =
                    document.createElement(
                        "div"
                    );

                snowflake.className =
                    `snowflake circle-snow ${depth}`;

                snowflake.textContent =
                    "•";

                let minSize;
                let maxSize;

                let minOpacity;
                let maxOpacity;

                let minDuration;
                let maxDuration;

                let driftAmount;

                if (
                    depth === "far"
                ) {

                    minSize = 3;
                    maxSize = 7;

                    minOpacity = 0.18;
                    maxOpacity = 0.42;

                    minDuration = 10;
                    maxDuration = 20;

                    driftAmount = 35;

                } else if (
                    depth === "mid"
                ) {

                    minSize = 5;
                    maxSize = 11;

                    minOpacity = 0.35;
                    maxOpacity = 0.68;

                    minDuration = 8;
                    maxDuration = 16;

                    driftAmount = 50;

                } else {

                    minSize = 8;
                    maxSize = 17;

                    minOpacity = 0.55;
                    maxOpacity = 0.95;

                    minDuration = 6;
                    maxDuration = 13;

                    driftAmount = 65;
                }

                const size =
                    minSize +
                    Math.random() *
                    (
                        maxSize -
                        minSize
                    );

                const opacity =
                    minOpacity +
                    Math.random() *
                    (
                        maxOpacity -
                        minOpacity
                    );

                const duration =
                    minDuration +
                    Math.random() *
                    (
                        maxDuration -
                        minDuration
                    );

                snowflake.style.left =
                    `${Math.random() * 100}%`;

                snowflake.style.setProperty(
                    "--size",
                    `${size}px`
                );

                snowflake.style.setProperty(
                    "--opacity",
                    opacity
                );

                snowflake.style.setProperty(
                    "--duration",
                    `${duration}s`
                );

                snowflake.style.setProperty(
                    "--delay",
                    `${-Math.random() * duration}s`
                );

                snowflake.style.top =
                    `${-20 - Math.random() * 100}px`;

                setSnowDrift(
                    snowflake,
                    driftAmount
                );

                let aboveChance;

                if (
                    depth === "far"
                ) {

                    aboveChance =
                        0.08;

                } else if (
                    depth === "mid"
                ) {

                    aboveChance =
                        0.40;

                } else {

                    aboveChance =
                        0.70;
                }

                const shouldGoAbove =
                    Math.random() <
                    aboveChance;

                if (
                    shouldGoAbove
                ) {

                    document
                        .getElementById(
                            "snowAbove"
                        )
                        .appendChild(
                            snowflake
                        );

                } else {

                    container.appendChild(
                        snowflake
                    );
                }
            }
        }

        createSnowflakes(
            document.getElementById(
                "snowFar"
            ),
            20
        );

        createSnowflakes(
            document.getElementById(
                "snowMid"
            ),
            15
        );

        createSnowflakes(
            document.getElementById(
                "snowNear"
            ),
            10
        );

        createCircleSnow(
            document.getElementById(
                "snowFar"
            ),
            45,
            "far"
        );

        createCircleSnow(
            document.getElementById(
                "snowMid"
            ),
            38,
            "mid"
        );

        createCircleSnow(
            document.getElementById(
                "snowNear"
            ),
            28,
            "near"
        );

        /*
         * =====================================================
         * LOAD durations.json
         * =====================================================
         */

        async function loadDurations() {

            if (
                metadataLoaded
            ) {
                return;
            }

            if (
                metadataLoadingPromise
            ) {
                return metadataLoadingPromise;
            }

            metadataLoadingPromise =
                (async () => {

                    const response =
                        await fetch(
                            DURATION_MANIFEST,
                            {
                                cache:
                                    "no-store"
                            }
                        );

                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            `Could not load durations.json (${response.status})`
                        );
                    }

                    const data =
                        await response.json();

                    if (
                        !data ||
                        !Array.isArray(
                            data.songs
                        )
                    ) {

                        throw new Error(
                            "durations.json must contain a 'songs' array."
                        );
                    }

                    songs =
                        data.songs.map(
                            (
                                entry,
                                index
                            ) => {

                                if (
                                    !entry ||
                                    typeof entry !==
                                        "object"
                                ) {

                                    throw new Error(
                                        `Invalid song entry at index ${index}.`
                                    );
                                }

                                const name =
                                    String(
                                        entry.name ??
                                        ""
                                    ).trim();

                                const file =
                                    String(
                                        entry.file ??
                                        ""
                                    ).trim();

                                const duration =
                                    Number(
                                        entry.duration
                                    );

                                if (
                                    !name
                                ) {

                                    throw new Error(
                                        `Song ${index + 1} is missing its name.`
                                    );
                                }

                                if (
                                    !file
                                ) {

                                    throw new Error(
                                        `"${name}" is missing its file in durations.json.`
                                    );
                                }

                                if (
                                    !Number.isFinite(
                                        duration
                                    ) ||
                                    duration <= 0
                                ) {

                                    throw new Error(
                                        `"${name}" has an invalid duration in durations.json.`
                                    );
                                }

                                return {
                                    name,
                                    file,
                                    duration
                                };
                            }
                        );

                    if (
                        songs.length === 0
                    ) {

                        throw new Error(
                            "durations.json contains no songs."
                        );
                    }

                    try {

                        const speechMetadata =
                            document.createElement(
                                "audio"
                            );

                        speechMetadata.preload =
                            "metadata";

                        speechMetadata.src =
                            SPEECH_SRC;

                        speechDuration =
                            await new Promise(
                                (
                                    resolve,
                                    reject
                                ) => {

                                    const timeout =
                                        setTimeout(
                                            () => {

                                                reject(
                                                    new Error(
                                                        "Timed out loading speech.mp3"
                                                    )
                                                );

                                            },
                                            15000
                                        );

                                    speechMetadata.addEventListener(
                                        "loadedmetadata",
                                        () => {

                                            clearTimeout(
                                                timeout
                                            );

                                            const duration =
                                                speechMetadata.duration;

                                            if (
                                                Number.isFinite(
                                                    duration
                                                ) &&
                                                duration > 0
                                            ) {

                                                resolve(
                                                    duration
                                                );

                                            } else {

                                                reject(
                                                    new Error(
                                                        "Invalid speech duration"
                                                    )
                                                );
                                            }

                                        },
                                        {
                                            once:
                                                true
                                        }
                                    );

                                    speechMetadata.addEventListener(
                                        "error",
                                        () => {

                                            clearTimeout(
                                                timeout
                                            );

                                            reject(
                                                new Error(
                                                    "Could not load speech.mp3"
                                                )
                                            );

                                        },
                                        {
                                            once:
                                                true
                                        }
                                    );

                                    speechMetadata.load();

                                }
                            );

                    } catch (
                        error
                    ) {

                        console.error(
                            "Could not read speech duration:",
                            error
                        );

                        speechDuration =
                            0;
                    }

                    totalPlaylistDuration =
                        0;

                    for (
                        let i = 0;
                        i < songs.length;
                        i++
                    ) {

                        totalPlaylistDuration +=
                            songs[i].duration;

                        if (
                            (i + 1) %
                                SONGS_PER_SPEECH ===
                                0 &&
                            speechDuration > 0
                        ) {

                            totalPlaylistDuration +=
                                speechDuration;
                        }
                    }

                    if (
                        totalPlaylistDuration <= 0
                    ) {

                        throw new Error(
                            "No valid playlist duration was found."
                        );
                    }

                    metadataLoaded =
                        true;

                    console.log(
                        "Loaded songs:",
                        songs.length
                    );

                    console.log(
                        "Speech duration:",
                        formatTime(
                            speechDuration
                        )
                    );

                    console.log(
                        "Total radio timeline:",
                        formatTime(
                            totalPlaylistDuration
                        )
                    );

                })()
                    .catch(
                        error => {

                            metadataLoadingPromise =
                                null;

                            throw error;
                        }
                    );

            return metadataLoadingPromise;
        }

        /*
         * =====================================================
         * CACHE ALL RADIO AUDIO FOR OFFLINE PLAYBACK
         *
         * Called only after loadDurations() has populated songs.
         * The service worker caches files in the background.
         * Audio is downloaded for caching, not played.
         * =====================================================
         */

        async function cacheRadioAudio() {

            if (
                !("serviceWorker" in navigator)
            ) {
                console.warn(
                    "Service workers are not supported in this browser."
                );

                return;
            }

            try {

                /*
                 * Wait until a service worker is active.
                 * Registration was started near the top of this script.
                 */

                const registration =
                    await navigator.serviceWorker.ready;

                const worker =
                    registration.active;

                if (!worker) {

                    console.warn(
                        "No active service worker is available yet."
                    );

                    return;
                }

                /*
                 * Build the list after durations.json has loaded.
                 * This ensures songs contains the complete playlist.
                 */

                const files = [
                    SPEECH_SRC,
                    ...songs.map(
                        song =>
                            SONG_FOLDER +
                            encodeURIComponent(
                                song.file
                            )
                    )
                ];

                worker.postMessage({
                    type: "CACHE_RADIO_AUDIO",
                    files
                });

                console.log(
                    "Offline audio caching requested:",
                    files.length,
                    "files"
                );

            } catch (error) {

                console.error(
                    "Could not start offline audio caching:",
                    error
                );
            }
        }

        /*
         * =====================================================
         * FIND LIVE SEGMENT
         * =====================================================
         */

        function findLiveSegment() {

            if (
                !metadataLoaded ||
                totalPlaylistDuration <= 0
            ) {

                return {
                    type:
                        "song",

                    index:
                        0,

                    offset:
                        0
                };
            }

            const elapsed =
                (
                    Date.now() -
                    RADIO_START
                ) / 1000;

            const position =
                (
                    (
                        elapsed %
                        totalPlaylistDuration
                    ) +
                    totalPlaylistDuration
                ) %
                totalPlaylistDuration;

            let accumulated =
                0;

            for (
                let i = 0;
                i < songs.length;
                i++
            ) {

                const duration =
                    songs[i].duration;

                if (
                    position <
                    accumulated +
                    duration
                ) {

                    return {
                        type:
                            "song",

                        index:
                            i,

                        offset:
                            position -
                            accumulated
                    };
                }

                accumulated +=
                    duration;

                if (
                    (i + 1) %
                        SONGS_PER_SPEECH ===
                        0 &&
                    speechDuration > 0
                ) {

                    if (
                        position <
                        accumulated +
                        speechDuration
                    ) {

                        return {
                            type:
                                "speech",

                            index:
                                i,

                            offset:
                                position -
                                accumulated
                        };
                    }

                    accumulated +=
                        speechDuration;
                }
            }

            return {
                type:
                    "song",

                index:
                    0,

                offset:
                    0
            };
        }

        /*
         * =====================================================
         * DISPLAY SONG INDEX
         * =====================================================
         */

        function getDisplaySongIndex(
            segment
        ) {

            if (
                segment.type ===
                "speech"
            ) {

                return (
                    (
                        segment.index +
                        1
                    ) %
                    songs.length
                );
            }

            return segment.index;
        }

        function getDisplayNextSongIndex(
            segment
        ) {

            const current =
                getDisplaySongIndex(
                    segment
                );

            return (
                (
                    current + 1
                ) %
                songs.length
            );
        }

        /*
         * =====================================================
         * UPDATE RADIO UI
         * =====================================================
         */

        function updateRadioUI(
            segment
        ) {

            if (
                !songs.length
            ) {
                return;
            }

            const current =
                getDisplaySongIndex(
                    segment
                );

            const next =
                getDisplayNextSongIndex(
                    segment
                );

            songNameElement.textContent =
                songs[current].name;

            upNextElement.textContent =
                songs[next].name;
        }

        /*
         * =====================================================
         * MEDIA SESSION
         * =====================================================
         */

        function updateLiveMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }

            if (
                !metadataLoaded ||
                !songs.length
            ) {
                return;
            }

            const segment =
                findLiveSegment();

            const title =
                segment.type ===
                    "speech"
                    ? "Christmas Radio"
                    : songs[
                        segment.index
                    ].name;

            try {

                navigator.mediaSession.metadata =
                    new MediaMetadata({

                        title:
                            title,

                        artist:
                            "Christmas Countdown Radio",

                        album:
                            "Christmas Countdown",

                        artwork: [
                            {
                                src:
                                    "./favicon.ico",

                                sizes:
                                    "512x512",

                                type:
                                    "image/x-icon"
                            }
                        ]
                    });

            } catch {}

            try {

                const audio =
                    segment.type ===
                        "speech"
                        ? speechAudio
                        : musicAudio;

                const duration =
                    audio.duration;

                const position =
                    audio.currentTime;

                if (
                    Number.isFinite(
                        duration
                    ) &&
                    duration > 0 &&
                    Number.isFinite(
                        position
                    ) &&
                    position >= 0 &&
                    position <= duration
                ) {

                    navigator.mediaSession
                        .setPositionState({

                            duration,

                            playbackRate:
                                audio.playbackRate ||
                                1,

                            position
                        });
                }

            } catch {}
        }

        /*
         * =====================================================
         * MEDIA SESSION SETUP
         * =====================================================
         */

        function setupMediaSession() {

            if (
                !("mediaSession" in navigator)
            ) {
                return;
            }

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "play",
                        () =>
                            resumeLive()
                    );

            } catch {}

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "pause",
                        pauseRadio
                    );

            } catch {}

            [
                "previoustrack",
                "nexttrack",
                "seekbackward",
                "seekforward"
            ].forEach(
                action => {

                    try {

                        navigator.mediaSession
                            .setActionHandler(
                                action,
                                () => {}
                            );

                    } catch {}
                }
            );

            try {

                navigator.mediaSession
                    .setActionHandler(
                        "seekto",
                        () => {}
                    );

            } catch {}
        }

        setupMediaSession();

        /*
         * =====================================================
         * LOAD AUDIO
         * =====================================================
         */

        async function loadAudio(
            audio,
            src,
            offset
        ) {

            const absoluteURL =
                new URL(
                    src,
                    location.href
                ).href;

            if (
                audio.src !==
                absoluteURL
            ) {

                audio.src =
                    src;

                audio.load();

                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        const onMetadata =
                            () => {

                                cleanup();

                                resolve();
                            };

                        const onError =
                            () => {

                                cleanup();

                                reject(
                                    new Error(
                                        "Could not load audio"
                                    )
                                );
                            };

                        const cleanup =
                            () => {

                                audio.removeEventListener(
                                    "loadedmetadata",
                                    onMetadata
                                );

                                audio.removeEventListener(
                                    "error",
                                    onError
                                );
                            };

                        audio.addEventListener(
                            "loadedmetadata",
                            onMetadata,
                            {
                                once:
                                    true
                            }
                        );

                        audio.addEventListener(
                            "error",
                            onError,
                            {
                                once:
                                    true
                            }
                        );

                    }
                );
            }

            if (
                Number.isFinite(
                    offset
                ) &&
                offset >= 0 &&
                Number.isFinite(
                    audio.duration
                ) &&
                offset <
                    audio.duration
            ) {

                audio.currentTime =
                    offset;
            }
        }

        /*
         * =====================================================
         * LOAD SONG
         * =====================================================
         */

        async function loadSong(
            index,
            offset
        ) {

            const song =
                songs[index];

            if (
                !song ||
                !song.file
            ) {

                throw new Error(
                    `Song ${index + 1} has no file in durations.json.`
                );
            }

            const songURL =
                SONG_FOLDER +
                encodeURIComponent(
                    song.file
                );

            await loadAudio(
                musicAudio,
                songURL,
                offset
            );
        }

        /*
         * =====================================================
         * LOAD SPEECH
         * =====================================================
         */

        async function loadSpeech(
            offset
        ) {

            await loadAudio(
                speechAudio,
                SPEECH_SRC,
                offset
            );
        }

        /*
         * =====================================================
         * START LIVE RADIO
         * =====================================================
         */

        async function playLive() {

            if (
                isChangingTrack
            ) {
                return;
            }

            isChangingTrack =
                true;

            try {

                await loadDurations();

                const segment =
                    findLiveSegment();

                currentSongIndex =
                    getDisplaySongIndex(
                        segment
                    );

                currentSegmentType =
                    segment.type;

                updateRadioUI(
                    segment
                );

                if (
                    segment.type ===
                    "speech"
                ) {

                    musicAudio.pause();

                    await loadSpeech(
                        segment.offset
                    );

                    await speechAudio.play();

                } else {

                    speechAudio.pause();

                    await loadSong(
                        segment.index,
                        segment.offset
                    );

                    await musicAudio.play();
                }

                radioPlaying =
                    true;

                updatePlayButton();

                updateLiveMediaSession();

                try {

                    navigator.mediaSession
                        .playbackState =
                        "playing";

                } catch {}

            } catch (
                error
            ) {

                console.error(
                    "Could not start live radio:",
                    error
                );

                radioPlaying =
                    false;

                updatePlayButton();

                songNameElement.textContent =
                    "Could not start radio";

                upNextElement.textContent =
                    "Please try again";

            } finally {

                isChangingTrack =
                    false;
            }
        }

        /*
         * =====================================================
         * PAUSE
         * =====================================================
         */

        function pauseRadio() {

            musicAudio.pause();

            speechAudio.pause();

            radioPlaying =
                false;

            updatePlayButton();

            try {

                navigator.mediaSession
                    .playbackState =
                    "paused";

            } catch {}
        }

        /*
         * =====================================================
         * RESUME
         * =====================================================
         */

        async function resumeLive() {

            musicAudio.pause();

            speechAudio.pause();

            await playLive();
        }

        /*
         * =====================================================
         * BUTTON
         * =====================================================
         */

        function updatePlayButton() {

            if (
                radioPlaying
            ) {

                playButton.textContent =
                    "⏸ Pause";

                playButton.classList.remove(
                    "paused"
                );

            } else {

                playButton.textContent =
                    "▶️ Play";

                playButton.classList.add(
                    "paused"
                );
            }
        }

        playButton.addEventListener(
            "click",
            async () => {

                if (
                    radioPlaying
                ) {

                    pauseRadio();

                } else {

                    await resumeLive();
                }
            }
        );

        /*
         * =====================================================
         * TRACK END
         * =====================================================
         */

        musicAudio.addEventListener(
            "ended",
            async () => {

                if (
                    radioPlaying
                ) {

                    await playLive();
                }
            }
        );

        speechAudio.addEventListener(
            "ended",
            async () => {

                if (
                    radioPlaying
                ) {

                    await playLive();
                }
            }
        );

        /*
         * =====================================================
         * ERROR RECOVERY
         * =====================================================
         */

        function retryLive() {

            if (
                !radioPlaying
            ) {
                return;
            }

            setTimeout(
                () => {

                    if (
                        radioPlaying
                    ) {

                        playLive();
                    }

                },
                1000
            );
        }

        musicAudio.addEventListener(
            "error",
            retryLive
        );

        speechAudio.addEventListener(
            "error",
            () => {

                console.error(
                    "Speech audio error."
                );

                retryLive();
            }
        );

        /*
         * =====================================================
         * PERIODIC LIVE SYNCHRONIZATION
         * =====================================================
         */

        async function syncRadio() {

            if (
                !radioPlaying
            ) {
                return;
            }

            try {

                const live =
                    findLiveSegment();

                const displayIndex =
                    getDisplaySongIndex(
                        live
                    );

                if (
                    live.type !==
                        currentSegmentType ||
                    displayIndex !==
                        currentSongIndex
                ) {

                    await playLive();

                    return;
                }

                const audio =
                    live.type ===
                        "speech"
                        ? speechAudio
                        : musicAudio;

                const drift =
                    Math.abs(
                        audio.currentTime -
                        live.offset
                    );

                if (
                    drift > 3
                ) {

                    audio.currentTime =
                        live.offset;
                }

                updateRadioUI(
                    live
                );

                updateLiveMediaSession();

            } catch (
                error
            ) {

                console.warn(
                    "Periodic sync failed:",
                    error
                );
            }
        }

        setInterval(
            syncRadio,
            5000
        );

        /*
         * =====================================================
         * MEDIA SESSION POSITION
         * =====================================================
         */

        setInterval(
            () => {

                if (
                    radioPlaying
                ) {

                    updateLiveMediaSession();
                }

            },
            3000
        );

        /*
         * =====================================================
         * VISIBILITY SYNCHRONIZATION
         * =====================================================
         */

        document.addEventListener(
            "visibilitychange",
            async () => {

                if (
                    document.visibilityState !==
                        "visible" ||
                    !radioPlaying
                ) {

                    return;
                }

                try {

                    const live =
                        findLiveSegment();

                    const displayIndex =
                        getDisplaySongIndex(
                            live
                        );

                    if (
                        live.type !==
                            currentSegmentType ||
                        displayIndex !==
                            currentSongIndex
                    ) {

                        await playLive();

                        return;
                    }

                    const audio =
                        live.type ===
                            "speech"
                            ? speechAudio
                            : musicAudio;

                    const drift =
                        Math.abs(
                            audio.currentTime -
                            live.offset
                        );

                    if (
                        drift > 3
                    ) {

                        await playLive();

                    } else {

                        updateRadioUI(
                            live
                        );

                        updateLiveMediaSession();
                    }

                } catch (
                    error
                ) {

                    console.warn(
                        "Visibility sync failed:",
                        error
                    );
                }
            }
        );

        /*
         * =====================================================
         * BLOCK TRACK-SKIPPING KEYS
         * =====================================================
         */

        document.addEventListener(
            "keydown",
            event => {

                const blocked = [
                    "ArrowLeft",
                    "ArrowRight",
                    "Home",
                    "End",
                    "MediaTrackNext",
                    "MediaTrackPrevious",
                    "MediaFastForward",
                    "MediaRewind"
                ];

                if (
                    blocked.includes(
                        event.key
                    )
                ) {

                    event.preventDefault();
                }
            }
        );

        /*
         * =====================================================
         * BLOCK CONTEXT MENU
         * =====================================================
         */

        document.addEventListener(
            "contextmenu",
            event =>
                event.preventDefault()
        );

        /*
         * =====================================================
         * INITIAL UI
         * =====================================================
         */

        updatePlayButton();

        songNameElement.textContent =
            "Christmas Radio Ready";

        upNextElement.textContent =
            "Loading...";

        /*
         * =====================================================
         * LOAD MANIFEST AND START OFFLINE CACHING
         *
         * The songs array is populated by loadDurations().
         * Only after that finishes do we send the complete
         * audio file list to the service worker.
         * =====================================================
         */

        loadDurations()
            .then(
                async () => {

                    const live =
                        findLiveSegment();

                    currentSongIndex =
                        getDisplaySongIndex(
                            live
                        );

                    currentSegmentType =
                        live.type;

                    updateRadioUI(
                        live
                    );

                    updateLiveMediaSession();

                    /*
                     * Start caching after the song list exists.
                     * The caching happens in the background and
                     * does not start audio playback.
                     */

                    await cacheRadioAudio();

                }
            )
            .catch(
                error => {

                    console.error(
                        "Radio metadata initialization failed:",
                        error
                    );

                    songNameElement.textContent =
                        "Radio unavailable";

                    upNextElement.textContent =
                        error.message;
                }
            );

        /*
         * =====================================================
         * CLEANUP
         * =====================================================
         */

        window.addEventListener(
            "beforeunload",
            () => {

                musicAudio.pause();

                speechAudio.pause();
            }
        );

    </script>

</body>

</html>
