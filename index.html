<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="UTF-8">


<meta name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover">

<meta name="theme-color" content="#12030a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="favicon.ico">

<title>Christmas Countdown • Live Radio</title>

<style>
:root {
    --red:
        #d71920;

    --red-dark:
        #8d0710;

    --green:
        #0b6b3a;

    --green-dark:
        #063d25;

    --gold:
        #ffd76a;

    --white:
        #ffffff;

    --glass-bg:
        rgba(255, 255, 255, .075);

    --glass-bg-strong:
        rgba(255, 255, 255, .105);

    --glass-border:
        rgba(255, 255, 255, .25);

    --glass-highlight:
        rgba(255, 255, 255, .42);

    --glass-shadow:
        rgba(0, 0, 0, .42);
}

* {
    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

    -webkit-tap-highlight-color:
        transparent;

    user-select:
        none;

    -webkit-user-select:
        none;
}

html,
body {
    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    touch-action:
        none;

    -webkit-text-size-adjust:
        100%;

    text-size-adjust:
        100%;

    overscroll-behavior:
        none;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Arial,
        sans-serif;

    color:
        var(--white);

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255, 255, 255, .08),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(11, 107, 58, .30),
            transparent 35%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(215, 25, 32, .28),
            transparent 35%
        ),
        #12030a;
}

/*
 * =====================================================
 * MAIN PAGE
 * =====================================================
 */

#phonePortraitViewport {
    width:
        100%;

    height:
        100%;

    position:
        relative;

    overflow:
        hidden;
}

/*
 * =====================================================
 * BACKGROUND
 * =====================================================
 */

#bg {
    position:
        absolute;

    inset:
        -4%;

    width:
        108%;

    height:
        108%;

    background-image:
        linear-gradient(rgba(15, 0, 5, .20), rgba(15, 0, 5, .48)),
        url("christmas-background.jpg");

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    filter:
        saturate(1.2) contrast(1.02);

    z-index:
        -5;

    transform:
        translateZ(0);
}

/*
 * =====================================================
 * SNOW
 * =====================================================
 */

.snow-layer {
    position:
        absolute;

    inset:
        0;

    pointer-events:
        none;

    overflow:
        hidden;
}

#snowFar,
#snowMid,
#snowNear {
    z-index:
        2;
}

#snowAbove {
    z-index:
        10;
}

.snowflake {
    position:
        absolute;

    top:
        -30px;

    color:
        rgba(255, 255, 255, .9);

    font-size:
        var(--size);

    opacity:
        var(--opacity);

    animation:
        smoothSnowFall var(--duration) linear infinite;

    animation-delay:
        var(--delay);

    will-change:
        transform;
}

.circle-snow {
    color:
        #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-weight:
        400;

    line-height:
        1;

    text-shadow:
        0 0 5px rgba(255, 255, 255, .35);

    will-change:
        transform,
        opacity;
}

.circle-snow.far {
    filter:
        blur(.25px);
}

.circle-snow.mid {
    filter:
        blur(.1px);

    text-shadow:
        0 0 7px rgba(255, 255, 255, .45);
}

.circle-snow.near {
    text-shadow:
        0 0 9px rgba(255, 255, 255, .65),
        0 0 18px rgba(255, 255, 255, .25);
}

@keyframes smoothSnowFall {
    0% {
        transform:
            translate3d(var(--drift-start), -50px, 0);
    }

    12% {
        transform:
            translate3d(var(--drift-one), 12vh, 0);
    }

    25% {
        transform:
            translate3d(var(--drift-two), 25vh, 0);
    }

    37% {
        transform:
            translate3d(var(--drift-three), 37vh, 0);
    }

    50% {
        transform:
            translate3d(var(--drift-four), 50vh, 0);
    }

    62% {
        transform:
            translate3d(var(--drift-five), 62vh, 0);
    }

    75% {
        transform:
            translate3d(var(--drift-six), 75vh, 0);
    }

    87% {
        transform:
            translate3d(var(--drift-seven), 87vh, 0);
    }

    100% {
        transform:
            translate3d(var(--drift-end), 110vh, 0);
    }
}

/*
 * =====================================================
 * MAIN CONTAINER
 * =====================================================
 */

#container {
    width:
        100%;

    height:
        100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));

    position:
        absolute;

    inset:
        0;

    z-index:
        5;

    overflow:
        hidden;
}

/*
 * =====================================================
 * LIQUID GLASS CARD
 * =====================================================
 */

.card {
    width:
        min(92vw, 900px);

    padding:
        clamp(30px, 5vw, 60px);

    text-align:
        center;

    position:
        relative;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .065),
            rgba(255, 255, 255, .018) 45%,
            rgba(255, 255, 255, .035)
        );

    border:
        1px solid rgba(255, 255, 255, .18);

    border-radius:
        32px;

    backdrop-filter:
        blur(14px) saturate(180%);

    -webkit-backdrop-filter:
        blur(14px) saturate(180%);

    box-shadow:
        0 35px 100px rgba(0, 0, 0, .42),
        0 10px 30px rgba(0, 0, 0, .18),
        inset 0 1px 0 rgba(255, 255, 255, .22),
        inset 1px 0 0 rgba(255, 255, 255, .07),
        inset 0 -1px 0 rgba(255, 255, 255, .04);
}

.card::before {
    content:
        "";

    position:
        absolute;

    inset:
        1px;

    border-radius:
        31px;

    pointer-events:
        none;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .08),
            transparent 40%
        );
}

.card::after {
    content:
        "";

    position:
        absolute;

    left:
        10%;

    right:
        10%;

    bottom:
        -18px;

    height:
        35px;

    border-radius:
        50%;

    background:
        rgba(255, 255, 255, .08);

    filter:
        blur(11px);

    pointer-events:
        none;

    z-index:
        -1;
}

.card > * {
    position:
        relative;

    z-index:
        2;
}

/*
 * =====================================================
 * LIVE LABEL
 * =====================================================
 */

.live-label {
    display:
        inline-flex;

    align-items:
        center;

    gap:
        9px;

    padding:
        9px 17px;

    border-radius:
        999px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .15),
            rgba(255, 255, 255, .055)
        );

    border:
        1px solid rgba(255, 255, 255, .22);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .28),
        0 5px 20px rgba(0, 0, 0, .12);

    backdrop-filter:
        blur(18px) saturate(160%);

    -webkit-backdrop-filter:
        blur(18px) saturate(160%);

    font-size:
        .78rem;

    font-weight:
        800;

    letter-spacing:
        .12em;

    text-transform:
        uppercase;

    margin-bottom:
        20px;
}

.live-dot {
    width:
        9px;

    height:
        9px;

    border-radius:
        50%;

    background:
        #ff3038;

    box-shadow:
        0 0 8px #ff3038,
        0 0 16px rgba(255, 48, 56, .65);

    animation:
        livePulse 1.4s infinite;
}

@keyframes livePulse {
    0%,
    100% {
        opacity:
            1;

        transform:
            scale(1);
    }

    50% {
        opacity:
            .45;

        transform:
            scale(.75);
    }
}

/*
 * =====================================================
 * CHRISTMAS TITLE / COUNTDOWN TITLE
 * =====================================================
 */

#title {
    font-size:
        clamp(3rem, 9vw, 7rem);

    font-weight:
        900;

    line-height:
        .95;

    margin:
        0 0 10px;

    background:
        linear-gradient(
            105deg,
            #ff2933 0%,
            #d71920 30%,
            #0fa15a 58%,
            #0b6b3a 82%,
            #16a864 100%
        );

    -webkit-background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    background-clip:
        text;

    text-shadow:
        0 8px 30px rgba(0, 0, 0, .25);
}

#subtitle {
    font-size:
        clamp(2rem, 5vw, 4rem);

    line-height:
        1;

    font-weight:
        800;

    color:
        #fff;

    text-shadow:
        0 5px 25px rgba(0, 0, 0, .4);

    margin-bottom:
        28px;
}

/*
 * =====================================================
 * COUNTDOWN GLASS
 * =====================================================
 */

#countdown {
    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    min-width:
        min(90%, 500px);

    padding:
        15px 25px;

    border-radius:
        999px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .13),
            rgba(255, 255, 255, .045)
        );

    border:
        1px solid rgba(255, 255, 255, .24);

    backdrop-filter:
        blur(11px) saturate(180%);

    -webkit-backdrop-filter:
        blur(11px) saturate(180%);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .35),
        inset 0 -1px 0 rgba(255, 255, 255, .07),
        0 12px 35px rgba(0, 0, 0, .20);

    font-size:
        clamp(1.1rem, 3vw, 1.7rem);

    font-weight:
        800;

    letter-spacing:
        .03em;

    margin-bottom:
        30px;

    cursor:
        pointer;

    touch-action:
        manipulation;
}

.song-wrapper {
    margin-bottom:
        28px;
}

.card.hide-song-info .song-wrapper {
    display:
        none!important;
}

/*
 * =====================================================
 * COUNTDOWN FOCUS MODE
 *
 * Double-tapping the countdown:
 * - Keeps the glass card visible.
 * - Keeps the Live Radio badge, Christmas, and Countdown headings visible.
 * - Hides Now Playing and Up Next.
 * - Hides the play button and footer.
 * =====================================================
 */

.card.countdown-only {
    position:
        relative;

    inset:
        auto;

    width:
        min(92vw, 900px);

    height:
        auto;

    max-width:
        900px;

    max-height:
        none;

    min-width:
        0;

    min-height:
        0;

    margin:
        auto;

    padding:
        clamp(30px, 5vw, 60px);

    border:
        1px solid rgba(255, 255, 255, .18);

    border-radius:
        32px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .065),
            rgba(255, 255, 255, .018) 45%,
            rgba(255, 255, 255, .035)
        );

    box-shadow:
        0 35px 100px rgba(0, 0, 0, .42),
        0 10px 30px rgba(0, 0, 0, .18),
        inset 0 1px 0 rgba(255, 255, 255, .22);

    backdrop-filter:
        blur(14px) saturate(180%);

    -webkit-backdrop-filter:
        blur(14px) saturate(180%);

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        visible;
}

.card.countdown-only > * {
    display:
        none!important;
}

.card.countdown-only > .live-label {
    display:
        inline-flex!important;
}

.card.countdown-only > #title,
.card.countdown-only > #subtitle {
    display:
        block!important;
}

.card.countdown-only::before,
.card.countdown-only::after {
    display:
        block;
}

.card.countdown-only #countdown {
    display:
        inline-flex!important;

    position:
        relative;

    inset:
        auto;

    width:
        auto;

    height:
        auto;

    min-width:
        min(90%, 500px);

    min-height:
        0;

    margin:
        0;

    padding:
        20px 30px;

    border:
        1px solid rgba(255, 255, 255, .35);

    border-radius:
        999px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .20),
            rgba(255, 255, 255, .075)
        );

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .4),
        0 15px 40px rgba(0, 0, 0, .25);

    backdrop-filter:
        blur(16px) saturate(180%);

    -webkit-backdrop-filter:
        blur(16px) saturate(180%);

    font-size:
        clamp(1.35rem, 4vw, 2.2rem);

    line-height:
        1.2;

    letter-spacing:
        .025em;

    white-space:
        normal;

    overflow-wrap:
        anywhere;

    text-align:
        center;

    cursor:
        pointer;

    touch-action:
        manipulation;
}

/*
 * =====================================================
 * NOW PLAYING
 * =====================================================
 */

.now-playing {
    font-size:
        .72rem;

    font-weight:
        800;

    text-transform:
        uppercase;

    letter-spacing:
        .18em;

    opacity:
        .72;

    margin-bottom:
        9px;
}

#songName {
    min-height:
        1.5em;

    font-size:
        clamp(1rem, 3vw, 1.45rem);

    font-weight:
        700;

    color:
        #fff;

    text-shadow:
        0 2px 12px rgba(0, 0, 0, .45);
}

.up-next-wrapper {
    margin-top:
        14px;

    margin-bottom:
        4px;
}

.up-next-label {
    font-size:
        .62rem;

    font-weight:
        800;

    text-transform:
        uppercase;

    letter-spacing:
        .16em;

    opacity:
        .52;

    margin-bottom:
        5px;
}

#upNext {
    min-height:
        1.3em;

    font-size:
        clamp(.85rem, 2.5vw, 1rem);

    font-weight:
        700;

    color:
        rgba(255, 255, 255, .78);

    text-shadow:
        0 2px 10px rgba(0, 0, 0, .35);
}

/*
 * =====================================================
 * PLAY BUTTON
 * =====================================================
 */

#playButton {
    position:
        relative;

    overflow:
        hidden;

    border:
        1px solid rgba(255, 255, 255, .25);

    outline:
        none;

    padding:
        15px 28px;

    border-radius:
        999px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .20),
            rgba(215, 25, 32, .42),
            rgba(141, 7, 16, .55)
        );

    color:
        #fff;

    font-size:
        1rem;

    font-weight:
        800;

    cursor:
        pointer;

    touch-action:
        manipulation;

    backdrop-filter:
        blur(20px) saturate(170%);

    -webkit-backdrop-filter:
        blur(20px) saturate(170%);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .4),
        inset 0 -1px 0 rgba(0, 0, 0, .15),
        0 12px 35px rgba(120, 0, 0, .28);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

#playButton::before {
    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        -40%;

    width:
        35%;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, .30),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left .65s ease;
}

#playButton:hover::before {
    left:
        110%;
}

#playButton:active {
    transform:
        scale(.96);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .3),
        0 5px 18px rgba(0, 0, 0, .25);
}

#playButton:hover {
    transform:
        translateY(-2px);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .45),
        0 16px 40px rgba(120, 0, 0, .34);
}

#playButton.paused {
    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, .18),
            rgba(13, 122, 67, .45),
            rgba(7, 85, 47, .55)
        );

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .4),
        0 12px 35px rgba(0, 80, 40, .25);
}

/*
 * =====================================================
 * FOOTER
 * =====================================================
 */

footer {
    margin-top:
        28px;

    font-size:
        .78rem;

    font-weight:
        700;

    opacity:
        .65;

    letter-spacing:
        .08em;
}

audio {
    display:
        none!important;
}

/*
 * =====================================================
 * MOBILE PORTRAIT
 * =====================================================
 */

@media (max-width: 768px) {
    #container {
        padding:
            max(15px, env(safe-area-inset-top)) max(15px, env(safe-area-inset-right)) max(15px, env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-left));
    }

    .card {
        width:
            94vw;

        padding:
            30px 20px;

        border-radius:
            28px;

        backdrop-filter:
            blur(12.5px) saturate(180%);

        -webkit-backdrop-filter:
            blur(12.5px) saturate(180%);
    }

    .card::before {
        border-radius:
            27px;
    }

    #countdown {
        min-width:
            0;

        width:
            100%;

        padding:
            13px 15px;

        margin-bottom:
            24px;
    }

    #songName {
        padding:
            0 8px;
    }

    #playButton {
        width:
            min(100%, 330px);
    }

    footer {
        margin-top:
            22px;
    }
}

/*
 * =====================================================
 * PHONE LANDSCAPE
 * =====================================================
 */

@media (max-width: 900px) and (orientation: landscape) {
    #container {
        padding:
            max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }

    .card {
        width:
            min(94vw, 850px);

        height:
            min(92dvh, 440px);

        min-height:
            0;

        padding:
            clamp(12px, 3vh, 22px) clamp(18px, 4vw, 38px);

        border-radius:
            25px;

        overflow:
            hidden;

        display:
            grid;

        grid-template-columns:
            minmax(0, 1.15fr) minmax(0, .95fr);

        grid-template-rows:
            auto auto auto auto;

        grid-template-areas:
            "live live" "title info" "subtitle info" "countdown button";

        column-gap:
            clamp(18px, 5vw, 48px);

        row-gap:
            clamp(2px, .8vh, 7px);

        align-items:
            center;

        justify-content:
            center;

        backdrop-filter:
            blur(14px) saturate(180%);

        -webkit-backdrop-filter:
            blur(14px) saturate(180%);
    }

    .card::before {
        border-radius:
            24px;
    }

    .live-label {
        grid-area:
            live;

        justify-self:
            center;

        padding:
            5px 12px;

        gap:
            7px;

        font-size:
            .58rem;

        margin-bottom:
            2px;
    }

    .live-dot {
        width:
            7px;

        height:
            7px;
    }

    #title {
        grid-area:
            title;

        font-size:
            clamp(2.25rem, 9.5vh, 4.4rem);

        line-height:
            .86;

        margin:
            0;

        white-space:
            nowrap;
    }

    #subtitle {
        grid-area:
            subtitle;

        font-size:
            clamp(1.45rem, 5.5vh, 2.5rem);

        line-height:
            .9;

        margin:
            0;

        white-space:
            nowrap;
    }

    #countdown {
        grid-area:
            countdown;

        justify-self:
            center;

        width:
            100%;

        min-width:
            0;

        max-width:
            100%;

        padding:
            8px 12px;

        margin:
            2px 0 0;

        font-size:
            clamp(.72rem, 3.2vh, 1.05rem);

        white-space:
            nowrap;
    }

    .song-wrapper {
        grid-area:
            info;

        width:
            100%;

        min-width:
            0;

        margin:
            0;

        padding:
            0 2px;

        text-align:
            center;
    }

    .now-playing {
        font-size:
            .55rem;

        letter-spacing:
            .16em;

        margin-bottom:
            4px;

        opacity:
            .68;
    }

    #songName {
        min-height:
            1.2em;

        padding:
            0;

        font-size:
            clamp(.82rem, 3.2vh, 1.1rem);

        line-height:
            1.15;

        white-space:
            nowrap;

        overflow:
            hidden;

        text-overflow:
            ellipsis;
    }

    .up-next-wrapper {
        margin:
            7px 0 0;
    }

    .up-next-label {
        font-size:
            .47rem;

        letter-spacing:
            .14em;

        margin-bottom:
            2px;
    }

    #upNext {
        min-height:
            1.1em;

        font-size:
            clamp(.64rem, 2.5vh, .86rem);

        line-height:
            1.1;

        id="interruptionAudio"

<script>

"use strict";

/* =====================================================
   SERVICE WORKER
   ===================================================== */

let serviceWorkerRegistration = null;

const serviceWorkerPromise = ("serviceWorker" in navigator)
    ? navigator.serviceWorker.register("./service-worker.js")
        .then(registration => {
            serviceWorkerRegistration = registration;
            console.log("Service worker registered:", registration.scope);
            return registration;
        })
        .catch(error => {
            console.error("Service worker registration failed:", error);
            return null;
        })
    : Promise.resolve(null);

/* =====================================================
   MOBILE GESTURE PREVENTION
   ===================================================== */

let lastTouchEnd = 0;

document.addEventListener("touchend", event => {
    const now = Date.now();

    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }

    lastTouchEnd = now;

}, { passive: false });

["gesturestart", "gesturechange", "gestureend"].forEach(eventName => {
    document.addEventListener(eventName, event => {
        event.preventDefault();
    }, { passive: false });
});

/* =====================================================
   ELEMENTS
   ===================================================== */

const musicAudio = document.getElementById("musicAudio");
const speechAudio = document.getElementById("speechAudio");
const interruptionAudio = document.getElementById("interruptionAudio");

const playButton = document.getElementById("playButton");
const songNameElement = document.getElementById("songName");
const upNextElement = document.getElementById("upNext");
const countdownElement = document.getElementById("countdown");

const countdownCard = document.querySelector(".card");

/* =====================================================
   DOUBLE-TAP COUNTDOWN FOCUS MODE

   Double-tap to show only the countdown & headings.
   Double-tap again to restore everything.
   ===================================================== */

let lastCountdownTap = 0;

const DOUBLE_TAP_DELAY = 350;

countdownElement.addEventListener("pointerup", event => {
    if (event.pointerType === "mouse" && event.button !== 0) {
        return;
    }

    const now = Date.now();

    if (now - lastCountdownTap <= DOUBLE_TAP_DELAY) {
        countdownCard.classList.toggle("countdown-only");

        lastCountdownTap = 0;
        return;
    }

    lastCountdownTap = now;

});

/* =====================================================
   RADIO CONFIGURATION
   ===================================================== */

const SONG_FOLDER = "./songs/";
const SPEECH_SRC = "./songs/speech.mp3";

const DURATION_MANIFEST = "./songs/durations.json";
const INTERRUPTION_MANIFEST = "./songs/interruptions.json";

const SONGS_PER_SPEECH = 4;
const DURATION_TIMEOUT = 30000;

const SIGNATURE_STORAGE_KEY = "christmasRadioContentSignature";

// Fixed instant: midnight Eastern Standard Time (UTC-5)
const RADIO_START = Date.parse("2025-12-01T00:00:00-05:00");

const EASTERN_ZONE = "America/New_York";

/* =====================================================
   STATE
   ===================================================== */

let songs = [];
let interruptions = [];

let speechDuration = 0;
let totalPlaylistDuration = 0;

let metadataLoaded = false;
let metadataLoadingPromise = null;

let radioPlaying = false;
let currentSongIndex = 0;
let currentSegmentType = "song";
let currentSegmentKey = "";

let isChangingTrack = false;
let retryCount = 0;
let retryTimeout = null;

let contentSignature = "";

let segmentTimer = null;
let driftStrikes = 0;

// Total timeline length in whole milliseconds, and the rounded speech length.
let totalPlaylistMs = 0;
let speechMs = 0;

// Learned per device: how long seek + play() takes to start (seconds).
let startLatency = 0.3;

/* =====================================================
   SERVER CLOCK

   nowMs() is the time every calculation uses. It is the
   device clock, corrected only when the device clock is
   clearly wrong (more than 2 seconds away from the server).
   The HTTP Date header only has 1-second resolution, so a
   correct clock is never touched.
   ===================================================== */

let clockOffset = 0;

function nowMs() {
    return Date.now() + clockOffset;
}

async function syncClock() {
    try {
        let best = null;

        for (let i = 0; i < 3; i++) {
            const t0 = Date.now();

            const response = await fetch(
                "./?clock=" + t0 + "-" + i,
                { method: "HEAD", cache: "no-store" }
            );

            const t1 = Date.now();
            const header = response.headers.get("Date");
            const server = header ? new Date(header).getTime() : NaN;

            if (!Number.isFinite(server)) continue;

            const rtt = t1 - t0;

            // +500 centers the 1-second truncation of the Date header.
            const offset = server + 500 - (t0 + rtt / 2);

            if (!best || rtt < best.rtt) {
                best = { rtt, offset };
            }
        }

        if (!best) return;

        clockOffset = Math.abs(best.offset) > 2000
            ? Math.round(best.offset)
            : 0;

        console.log("Clock offset applied (ms):", clockOffset);

    } catch (error) {
        console.warn("Could not sync clock:", error);
    }
}

/* =====================================================
   TIME FORMAT
   ===================================================== */

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
    }

    seconds = Math.floor(seconds);

    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const remainingSeconds = seconds % 60;

    if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;

}

/* =====================================================
   EASTERN TIME CONVERSION

   Interruption dates use:
   M/D/YYYY/h:mmam

   Example:
   1/1/2026/12:00am

   This converts the specified Eastern local
   time into an absolute timestamp. It also
   accounts for daylight-saving time.
   ===================================================== */

const easternPartsFormatter = new Intl.DateTimeFormat("en-US", {
    timeZone: EASTERN_ZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
});

function getEasternParts(timestamp) {
    const parts = easternPartsFormatter.formatToParts(
        new Date(timestamp)
    );

    const result = {};

    for (const part of parts) {
        if (part.type !== "literal") {
            result[part.type] = Number(part.value);
        }
    }

    return result;

}

function easternDateToTimestamp(year, month, day, hour, minute) {
    const targetUTC = Date.UTC(
        year,
        month - 1,
        day,
        hour,
        minute,
        0
    );

    let candidate = targetUTC;

    // Reconcile the desired Eastern clock time with its UTC offset.
    for (let i = 0; i < 4; i++) {
        const parts = getEasternParts(candidate);

        const representedUTC = Date.UTC(
            parts.year,
            parts.month - 1,
            parts.day,
            parts.hour,
            parts.minute,
            parts.second
        );

        const difference = targetUTC - representedUTC;

        if (difference === 0) {
            break;
        }

        candidate += difference;
    }

    const verified = getEasternParts(candidate);

    if (
        verified.year !== year ||
        verified.month !== month ||
        verified.day !== day ||
        verified.hour !== hour ||
        verified.minute !== minute
    ) {
        throw new Error(
            "The interruption date is not a valid Eastern local time."
        );
    }

    return candidate;

}

function parseInterruptionDate(value) {
    const text = String(value ?? "").trim();

    const match = text.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})\/(\d{1,2}):(\d{2})\s*(am|pm)$/i
    );

    if (!match) {
        throw new Error(
            `Invalid interruption date "${text}". Use M/D/YYYY/h:mmam.`
        );
    }

    const month = Number(match[1]);
    const day = Number(match[2]);
    const year = Number(match[3]);

    let hour = Number(match[4]);
    const minute = Number(match[5]);
    const meridiem = match[6].toLowerCase();

    if (
        month < 1 || month > 12 ||
        day < 1 || day > 31 ||
        hour < 1 || hour > 12 ||
        minute < 0 || minute > 59
    ) {
        throw new Error(
            `Invalid interruption date "${text}".`
        );
    }

    if (meridiem === "am") {
        hour = hour === 12 ? 0 : hour;
    } else {
        hour = hour === 12 ? 12 : hour + 12;
    }

    return easternDateToTimestamp(
        year,
        month,
        day,
        hour,
        minute
    );

}

/* =====================================================
   LOAD durations.json
   ===================================================== */

async function fetchJSON(path) {
    const response = await fetch(path, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            `Could not load ${path} (${response.status}).`
        );
    }

    return response.json();

}

function parseSongs(data) {
    if (!data || !Array.isArray(data.songs)) {
        throw new Error(
            "durations.json must contain a 'songs' array."
        );
    }

    const parsed = data.songs.map((entry, index) => {
        if (!entry || typeof entry !== "object") {
            throw new Error(`Invalid song entry at index ${index}.`);
        }

        const name = String(entry.name ?? "").trim();
        const file = String(entry.file ?? "").trim();
        const duration = Number(entry.duration);

        if (!name) {
            throw new Error(`Song ${index + 1} is missing its name.`);
        }

        if (!file) {
            throw new Error(
                `"${name}" is missing its file in durations.json.`
            );
        }

        if (!Number.isFinite(duration) || duration <= 0) {
            throw new Error(
                `"${name}" has an invalid duration in durations.json.`
            );
        }

        // Whole milliseconds: every device does identical integer math.
        return { name, file, duration, ms: Math.round(duration * 1000) };
    });

    if (parsed.length === 0) {
        throw new Error("durations.json contains no songs.");
    }

    return parsed;

}

/* =====================================================
   LOAD interruptions.json

   Format:
   {
       "interruptions": [
           {
               "date": "1/1/2026/12:00am",
               "file": "new-year.mp3",
               "duration": 30
           }
       ]
   }

   Duration is measured in seconds.
   Files are stored in ./songs/.
   ===================================================== */

function parseInterruptions(data) {
    if (!data || !Array.isArray(data.interruptions)) {
        throw new Error(
            "interruptions.json must contain an 'interruptions' array."
        );
    }

    const parsed = data.interruptions.map((entry, index) => {
        if (!entry || typeof entry !== "object") {
            throw new Error(
                `Invalid interruption entry at index ${index}.`
            );
        }

        const file = String(entry.file ?? "").trim();
        const date = String(entry.date ?? "").trim();
        const duration = Number(entry.duration);

        if (!file) {
            throw new Error(
                `Interruption ${index + 1} is missing its file.`
            );
        }

        if (!date) {
            throw new Error(
                `Interruption ${index + 1} is missing its date.`
            );
        }

        if (!Number.isFinite(duration) || duration <= 0) {
            throw new Error(
                `Interruption ${index + 1} has an invalid duration.`
            );
        }

        const start = parseInterruptionDate(date);

        const name = String(
            entry.name ??
            file.replace(/\.[^/.]+$/, "")
        ).trim();

        return {
            date,
            file,
            name: name || file,
            duration,
            start,
            end: start + duration * 1000
        };
    });

    parsed.sort((a, b) => a.start - b.start);

    return parsed;

}

/* =====================================================
   FIND ACTIVE INTERRUPTION
   ===================================================== */

function findLiveInterruption(now = nowMs()) {
    if (!interruptions.length) {
        return null;
    }

    for (let i = 0; i < interruptions.length; i++) {
        const interruption = interruptions[i];

        if (
            now >= interruption.start &&
            now < interruption.end
        ) {
            return {
                type: "interruption",
                index: i,
                offset: (now - interruption.start) / 1000,
                length: interruption.duration,
                name: interruption.name,
                file: interruption.file
            };
        }
    }

    return null;

}

/* =====================================================
   FIND NEXT INTERRUPTION BOUNDARY
   ===================================================== */

function findNextInterruptionBoundary(now = nowMs()) {
    let next = Infinity;

    for (const interruption of interruptions) {
        if (interruption.start > now) {
            next = Math.min(next, interruption.start);
        }

        if (interruption.end > now) {
            next = Math.min(next, interruption.end);
        }
    }

    return next;

}

/* =====================================================
   SCHEDULE INTERRUPTION BOUNDARY
   ===================================================== */

let interruptionBoundaryTimer = null;

function scheduleInterruptionBoundary() {
    clearTimeout(interruptionBoundaryTimer);

    if (!radioPlaying || !metadataLoaded) {
        return;
    }

    const boundary = findNextInterruptionBoundary();

    if (!Number.isFinite(boundary)) {
        return;
    }

    const delay = Math.max(
        25,
        boundary - nowMs() + 25
    );

    interruptionBoundaryTimer = setTimeout(() => {
        if (radioPlaying) {
            playLive();
        }
    }, delay);

}

/* =====================================================
   SPEECH DURATION

   Measured from speech.mp3, then rounded UP to a whole
   second so every browser and device ends up with the
   exact same value (for example 11.42 and 11.69 both
   become 12).

   It never falls back to 0. If the file can't be
   measured, the radio shows an error instead of playing
   the wrong song on a shifted timeline.
   ===================================================== */

async function loadSpeechDuration() {
    const probe = new Audio();

    probe.preload = "metadata";
    probe.src = SPEECH_SRC;
    probe.load();

    try {
        await waitForAudioMetadata(probe);
    } finally {
        // Release the probe element afterwards.
        setTimeout(() => {
            probe.removeAttribute("src");
            probe.load();
        }, 0);
    }

    const measured = probe.duration;

    if (!Number.isFinite(measured) || measured <= 0) {
        throw new Error("Could not read the speech.mp3 duration.");
    }

    return Math.ceil(measured);

}

/* =====================================================
   CALCULATE PLAYLIST DURATION
   ===================================================== */

function calculatePlaylistDuration() {
    speechMs = Math.round(speechDuration * 1000);

    let ms = 0;

    for (let i = 0; i < songs.length; i++) {
        ms += songs[i].ms;

        if (
            (i + 1) % SONGS_PER_SPEECH === 0 &&
            speechMs > 0
        ) {
            ms += speechMs;
        }
    }

    totalPlaylistMs = ms;

    return ms / 1000;

}

/* =====================================================
   CONTENT SIGNATURE

   Includes everything that shapes the timeline, so a
   stale page or stale data shows up as a mismatch.
   ===================================================== */

function computeContentSignature(
    loadedSongs,
    speechSeconds,
    loadedInterruptions
) {
    const songText = loadedSongs
        .map(song => `${song.file}|${song.name}|${song.duration}`)
        .join("\n");

    const interruptionText = loadedInterruptions
        .map(item =>
            `${item.date}|${item.file}|${item.name}|${item.duration}`
        )
        .sort()
        .join("\n");

    const text =
        `start|${RADIO_START}|perSpeech|${SONGS_PER_SPEECH}` +
        `\n${songText}` +
        `\nspeech|${speechSeconds}` +
        `\ninterruptions\n${interruptionText}`;

    let hash = 2166136261;

    for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }

    return (hash >>> 0).toString(16) + "-" + text.length;

}

function getSavedSignature() {
    try {
        return localStorage.getItem(SIGNATURE_STORAGE_KEY);
    } catch {
        return null;
    }
}

function saveSignature(signature) {
    try {
        localStorage.setItem(SIGNATURE_STORAGE_KEY, signature);
    } catch {}
}

/* =====================================================
   LOAD ALL METADATA
   ===================================================== */

async function loadDurations() {
    if (metadataLoaded) {
        return songs;
    }

    if (metadataLoadingPromise) {
        return metadataLoadingPromise;
    }

    metadataLoadingPromise = (async () => {
        const [data, interruptionData] = await Promise.all([
            fetchJSON(DURATION_MANIFEST),
            fetchJSON(INTERRUPTION_MANIFEST)
        ]);

        songs = parseSongs(data);
        interruptions = parseInterruptions(interruptionData);

        speechDuration = await loadSpeechDuration();

        contentSignature = computeContentSignature(
            songs,
            speechDuration,
            interruptions
        );

        totalPlaylistDuration = calculatePlaylistDuration();

        if (
            !Number.isFinite(totalPlaylistDuration) ||
            totalPlaylistDuration <= 0
        ) {
            throw new Error("No valid playlist duration was found.");
        }

        metadataLoaded = true;

        console.log("Loaded songs:", songs.length);
        console.log("Loaded interruptions:", interruptions.length);
        console.log("Speech duration (rounded):", speechDuration);
        console.log(
            "Total radio timeline:",
            formatTime(totalPlaylistDuration),
            totalPlaylistDuration
        );
        console.log("Content signature:", contentSignature);
        console.log("Total timeline (ms):", totalPlaylistMs);

        return songs;

    })().catch(error => {
        metadataLoaded = false;
        metadataLoadingPromise = null;

        console.error("Playlist loading failed:", error);

        throw error;
    });

    return metadataLoadingPromise;

}

/* =====================================================

   ===================================================== */

const easternYearFormatter = new Intl.DateTimeFormat("en-US", {
    timeZone: EASTERN_ZONE,
    year: "numeric"
});

function updateCountdown() {
    const now = nowMs();

    const year = Number(easternYearFormatter.format(new Date(now)));

    let christmas = Date.parse(`${year}-12-25T00:00:00-05:00`);

    if (now >= christmas) {
        christmas = Date.parse(`${year + 1}-12-25T00:00:00-05:00`);
    }

    const seconds = Math.max(
        0,
        Math.floor((christmas - now) / 1000)
    );

    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    countdownElement.textContent =
        `${days}d ${hours}h ${minutes}m ${secs}s`;

}

/* =====================================================
   SNOW DRIFT
   ===================================================== */

function setSnowDrift(snowflake, driftAmount) {
    const center = (Math.random() - 0.5) * driftAmount;
    const swing = 8 + Math.random() * (driftAmount * 0.55);
    const direction = Math.random() > 0.5 ? 1 : -1;

    const positions = {
        "--drift-start": center - swing * direction,
        "--drift-one": center + swing * .25 * direction,
        "--drift-two": center + swing * direction,
        "--drift-three": center + swing * .35 * direction,
        "--drift-four": center - swing * .45 * direction,
        "--drift-five": center - swing * direction,
        "--drift-six": center - swing * .30 * direction,
        "--drift-seven": center + swing * .55 * direction,
        "--drift-end": center + swing * .15 * direction
    };

    for (const [property, value] of Object.entries(positions)) {
        snowflake.style.setProperty(
            property,
            `${value}px`
        );
    }

}

            maxSize = 17;
            minOpacity = .55;
            maxOpacity = .95;
            minDuration = 6;
            maxDuration = 13;
            driftAmount = 65;
        }

        const size =
            minSize + Math.random() * (maxSize - minSize);

        const opacity =
            minOpacity + Math.random() * (maxOpacity - minOpacity);

        const duration =
            minDuration + Math.random() * (maxDuration - minDuration);

        snowflake.style.setProperty("--size", `${size}px`);

/* =====================================================
   OFFLINE AUDIO CACHING
   ===================================================== */

async function cacheRadioAudio() {
    if (!("serviceWorker" in navigator)) {
        console.warn("Service workers are not supported.");
        return;
    }

    try {
        const registration =
            serviceWorkerRegistration ||
            await serviceWorkerPromise ||
            await navigator.serviceWorker.ready;

        if (!registration) return;

        const activeWorker =
            registration.active ||
            registration.waiting ||
            registration.installing;

        if (!activeWorker) {
            console.warn("No service worker is available.");
            return;
        }

        const startIndex = getDisplaySongIndex(findNormalLiveSegment());

        const songURLs = songs.map((_, i) => {
            const song = songs[(startIndex + i) % songs.length];
            return SONG_FOLDER + encodeURIComponent(song.file);
        });

        const interruptionURLs = interruptions.map(interruption => {
            return SONG_FOLDER + encodeURIComponent(interruption.file);
        });

        const files = [
            songURLs[0],
            ...(speechDuration > 0 ? [SPEECH_SRC] : []),
            ...songURLs.slice(1),
            ...interruptionURLs
        ];

        const contentChanged =
            getSavedSignature() !== contentSignature;

        if (contentChanged) {
            activeWorker.postMessage({
                type: "REFRESH_RADIO_AUDIO",
                files,
                signature: contentSignature
            });

            console.log(
                "Playlist or interruptions changed. Re-caching all audio:",
                files.length,
                "files"
            );
        } else {
            activeWorker.postMessage({
                type: "CACHE_RADIO_AUDIO",
                files
            });

            console.log(
                "Offline audio caching requested:",
                files.length,
                "files"
            );
        }

    } catch (error) {
        console.error(
            "Could not start offline caching:",
            error
        );
    }

}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", event => {
        const data = event.data || {};

        if (data.type === "RADIO_AUDIO_CACHE_FINISHED") {
            console.log(
                `Audio caching finished: ${data.completed}/${data.total}` +
                (data.failed ? `, ${data.failed} failed` : "")
            );

            if (data.refreshed && data.signature) {
                saveSignature(data.signature);
            }
        }
    });

}

/* =====================================================
   FIND LIVE SEGMENT

   Interruptions take priority over the
   normal music and speech timeline.
   ===================================================== */

function findLiveSegment() {
    if (
        !metadataLoaded ||
        totalPlaylistDuration <= 0
    ) {
        return {
            type: "song",
            index: 0,
            offset: 0,
            length: 0
        };
    }

    const activeInterruption = findLiveInterruption();

    if (activeInterruption) {
        return activeInterruption;
    }

    return findNormalLiveSegment();

}

/* =====================================================
   DISPLAY SONG INDEX
   ===================================================== */

function getDisplaySongIndex(segment) {
    if (segment.type === "interruption") {
        return getDisplaySongIndex(findNormalLiveSegment());
    }

    if (segment.type === "speech") {
        return (segment.index + 1) % songs.length;
    }

    return segment.index;

}

function getDisplayNextSongIndex(segment) {
    return (
        getDisplaySongIndex(segment) + 1
    ) % songs.length;
}

/* =====================================================
   FIND NORMAL LIVE SEGMENT

   This ignores interruptions and calculates
   the underlying music/speech timeline.
   ===================================================== */

function findNormalLiveSegment() {
    if (
        !metadataLoaded ||
        totalPlaylistMs <= 0
    ) {
        return {
            type: "song",
            index: 0,
            offset: 0,
            length: 0
        };
    }

    // One unbroken timeline that started at RADIO_START (Dec 1, 2025).
    const elapsedMs = Math.max(0, nowMs() - RADIO_START);

    const positionMs = Math.floor(elapsedMs) % totalPlaylistMs;

    let accumulated = 0;

    for (let i = 0; i < songs.length; i++) {
        const durationMs = songs[i].ms;

        if (positionMs < accumulated + durationMs) {
            return {
                type: "song",
                index: i,
                offset: (positionMs - accumulated) / 1000,
                length: durationMs / 1000
            };
        }

        accumulated += durationMs;

        if (
            (i + 1) % SONGS_PER_SPEECH === 0 &&
            speechMs > 0
        ) {
            if (positionMs < accumulated + speechMs) {
                return {
                    type: "speech",
                    index: i,
                    offset: (positionMs - accumulated) / 1000,
                    length: speechMs / 1000
                };
            }

            accumulated += speechMs;
        }
    }

    return {
        type: "song",
        index: 0,
        offset: 0,
        length: 0
    };

}

/* =====================================================
   UPDATE RADIO UI
   ===================================================== */

function updateRadioUI(segment) {
    if (!songs.length) return;

    if (segment.type === "interruption") {
        songNameElement.textContent =

        const nextSong = findNormalLiveSegment();

        const nextIndex = getDisplayNextSongIndex(nextSong);

        upNextElement.textContent =

    }

    const current = getDisplaySongIndex(segment);
    const next = getDisplayNextSongIndex(segment);

    songNameElement.textContent =
        segment.type === "speech"
            ? "Christmas Radio Announcement"
            : songs[current].name;

    upNextElement.textContent =
        songs[next].name;

}

/* =====================================================
   MEDIA SESSION
   ===================================================== */

function updateLiveMediaSession() {
    if (
        !("mediaSession" in navigator) ||
        !metadataLoaded ||
        !songs.length
    ) {
        return;
    }

    const segment = findLiveSegment();

    let title;
    let audio;

    if (segment.type === "interruption") {
        title = segment.name || "Scheduled Interruption";
        audio = interruptionAudio;
    } else if (segment.type === "speech") {
        title = "Christmas Radio";
        audio = speechAudio;
    } else {
        title = songs[segment.index].name;
        audio = musicAudio;
    }

    try {
        navigator.mediaSession.metadata = new MediaMetadata({
            title,
            artist: "Christmas Countdown Radio",
            album: "Christmas Countdown",
            artwork: [{
                src: "./favicon.ico",
                sizes: "512x512",
                type: "image/x-icon"
            }]
        });
    } catch {}

    try {
        const duration = audio.duration;
        const position = audio.currentTime;

        if (
            Number.isFinite(duration) &&
            duration > 0 &&
            Number.isFinite(position) &&
            position >= 0 &&
            position <= duration
        ) {
            navigator.mediaSession.setPositionState({
                duration,
                playbackRate: audio.playbackRate || 1,
                position
            });
        }
    } catch {}

}

/* =====================================================
   MEDIA SESSION SETUP
   ===================================================== */

function setupMediaSession() {
    if (!("mediaSession" in navigator)) return;

    try {
        navigator.mediaSession.setActionHandler(
            "play",
            () => resumeLive()
        );
    } catch {}

    try {
        navigator.mediaSession.setActionHandler(
            "pause",
            pauseRadio
        );
    } catch {}

    [
        "previoustrack",
        "nexttrack",
        "seekbackward",
        "seekforward",
        "seekto"
    ].forEach(action => {
        try {
            navigator.mediaSession.setActionHandler(
                action,
                () => {}
            );
        } catch {}
    });

}

setupMediaSession();

/* =====================================================
   AUDIO METADATA WAITING
   ===================================================== */

function waitForAudioMetadata(audio) {
    if (
        audio.readyState >= 1 &&
        Number.isFinite(audio.duration)
    ) {
        return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
        let finished = false;

        const timeout = setTimeout(() => {
            finish(
                new Error("Audio metadata timed out.")
            );
        }, DURATION_TIMEOUT);

        function cleanup() {
            clearTimeout(timeout);

            audio.removeEventListener(
                "loadedmetadata",
                onLoaded
            );

            audio.removeEventListener(
                "error",
                onError
            );
        }

        function finish(error) {
            if (finished) return;

            finished = true;
            cleanup();

            if (error) {
                reject(error);
            } else {
                resolve();
            }
        }

        function onLoaded() {
            finish();
        }

        function onError() {
            finish(
                new Error("Could not load audio metadata.")
            );
        }

        audio.addEventListener(
            "loadedmetadata",
            onLoaded,
            { once: true }
        );

        audio.addEventListener(
            "error",
            onError,
            { once: true }
        );
    });

}

/* =====================================================
   LOAD AUDIO
   ===================================================== */

async function loadAudio(audio, src) {
    const absoluteURL = new URL(
        src,
        location.href
    ).href;

    if (audio.src !== absoluteURL) {
        audio.src = src;
        audio.load();
    }

    await waitForAudioMetadata(audio);

}

/* =====================================================
   SEEK AND WAIT UNTIL THE SEEK FINISHES
   ===================================================== */

function seekAudio(audio, time) {
    return new Promise(resolve => {
        if (!Number.isFinite(audio.duration)) {
            resolve();
            return;
        }

        const target = Math.min(
            Math.max(0, time),
            Math.max(0, audio.duration - 0.25)
        );

        if (Math.abs(audio.currentTime - target) < 0.05) {
            resolve();
            return;
        }

        let done = false;

        const finish = () => {
            if (done) return;

            done = true;
            clearTimeout(timer);
            audio.removeEventListener("seeked", finish);
            resolve();
        };

        const timer = setTimeout(finish, 5000);

        audio.addEventListener("seeked", finish);

        audio.currentTime = target;
    });

}

/* =====================================================
   SEGMENT TIMER
   ===================================================== */

function scheduleAfterSegment(live) {
    clearTimeout(segmentTimer);

    const remaining = Math.max(
        0.1,
        (live.length || 0) - live.offset
    );

    segmentTimer = setTimeout(() => {
        if (radioPlaying) {
            playLive();
        }
    }, remaining * 1000 + 50);

}

/* =====================================================
   LOAD THE CURRENT LIVE SEGMENT
   ===================================================== */

async function prepareSegment(segment) {
    if (segment.type === "interruption") {
        musicAudio.pause();
        speechAudio.pause();

        await loadInterruption(segment.index);

        return interruptionAudio;
    }

    interruptionAudio.pause();

    if (segment.type === "speech") {
        musicAudio.pause();

        await loadSpeech();

        return speechAudio;
    }

    speechAudio.pause();

    await loadSong(segment.index);

    return musicAudio;

}

/* =====================================================
   SEGMENT KEY
   ===================================================== */

function getSegmentKey(segment) {
    return `${segment.type}:${segment.index}`;
}

/* =====================================================
   START LIVE RADIO
   ===================================================== */

async function playLive() {
    if (isChangingTrack) return;

    isChangingTrack = true;

    clearTimeout(segmentTimer);

    try {
        await loadDurations();

        let segment;
        let audio = null;

        // Keep checking the live timeline while files load.
        for (let attempt = 0; attempt < 5; attempt++) {
            segment = findLiveSegment();

            audio = await prepareSegment(segment);

            const check = findLiveSegment();

            if (
                getSegmentKey(check) === getSegmentKey(segment)
            ) {
                segment = check;
                break;
            }
        }

        // Recalculate the actual position after loading.
        const live = findLiveSegment();

        if (
            getSegmentKey(live) !==
            getSegmentKey(segment)
        ) {
            audio = await prepareSegment(live);
        }

        currentSongIndex = getDisplaySongIndex(live);
        currentSegmentType = live.type;
        currentSegmentKey = getSegmentKey(live);

        updateRadioUI(live);

        radioPlaying = true;
        retryCount = 0;
        driftStrikes = 0;

        updatePlayButton();

        scheduleInterruptionBoundary();

        // The actual file may be shorter than its scheduled duration.
        if (live.offset >= audio.duration - 0.25) {
            console.warn(
                "Audio is shorter than its scheduled duration:",
                audio.src
            );

            scheduleAfterSegment(live);
            return;
        }

        // Start slightly ahead to make up for how long this device takes to begin playing.
        await seekAudio(audio, live.offset + startLatency);

        // The timeline might have changed during the seek.
        const afterSeek = findLiveSegment();

        if (
            getSegmentKey(afterSeek) !==
            currentSegmentKey
        ) {
            await playLive();
            return;
        }

        const playStarted = performance.now();

        await audio.play();

        // Learn how long starting takes on this device (smoothed and capped).
        const measuredLatency =
            (performance.now() - playStarted) / 1000;

        startLatency = Math.min(
            3,
            startLatency * 0.5 + measuredLatency * 0.5
        );

        // Compensate for the time spent seeking and starting.
        const after = findLiveSegment();

        if (
            getSegmentKey(after) === currentSegmentKey &&
            Math.abs(audio.currentTime - after.offset) > 0.4
        ) {
            await seekAudio(audio, after.offset + startLatency);
        }

        updateLiveMediaSession();

        try {
            navigator.mediaSession.playbackState =
                "playing";
        } catch {}

    } catch (error) {
        console.error(
            "Could not start live radio:",
            error
        );

        radioPlaying = false;

        updatePlayButton();

        songNameElement.textContent =
            "Could not start radio";

        upNextElement.textContent =
            error.message;

    } finally {
        isChangingTrack = false;
    }

}

/* =====================================================
   PAUSE RADIO
   ===================================================== */

function pauseRadio() {
    clearTimeout(segmentTimer);
    clearTimeout(interruptionBoundaryTimer);

    musicAudio.pause();
    speechAudio.pause();
    interruptionAudio.pause();

    radioPlaying = false;

    updatePlayButton();

    try {
        navigator.mediaSession.playbackState =
            "paused";
    } catch {}

}

/* =====================================================
   RESUME RADIO
   ===================================================== */

async function resumeLive() {
    if (radioPlaying) return;

    musicAudio.pause();
    speechAudio.pause();
    interruptionAudio.pause();

    await playLive();

}

/* =====================================================
   PLAY BUTTON
   ===================================================== */

playButton.addEventListener("click", async () => {
    if (radioPlaying) {
        pauseRadio();
    } else {
        await resumeLive();
    }
});

/* =====================================================
   TRACK END
   ===================================================== */

async function handleTrackEnded() {
    if (!radioPlaying || isChangingTrack) return;

    const live = findLiveSegment();

    if (getSegmentKey(live) === currentSegmentKey) {
        scheduleAfterSegment(live);
        return;
    }

    await playLive();

}

musicAudio.addEventListener("ended", handleTrackEnded);
speechAudio.addEventListener("ended", handleTrackEnded);
interruptionAudio.addEventListener("ended", handleTrackEnded);

/* =====================================================
   ERROR RECOVERY
   ===================================================== */

function retryLive() {
    if (!radioPlaying) return;

    if (retryTimeout) {
        clearTimeout(retryTimeout);
    }

    if (retryCount >= 3) {
        console.error(
            "Radio stopped after repeated playback errors."
        );

        pauseRadio();

        songNameElement.textContent =
            "Radio playback stopped";

        upNextElement.textContent =
            "Please try playing again.";

        return;
    }

    retryCount++;

    retryTimeout = setTimeout(() => {
        if (radioPlaying) {
            playLive();
        }
    }, 1500);

}

musicAudio.addEventListener("error", retryLive);
speechAudio.addEventListener("error", retryLive);
interruptionAudio.addEventListener("error", retryLive);

/* =====================================================
   LIVE SYNCHRONIZATION
   ===================================================== */

async function syncRadio(force = false) {
    if (!radioPlaying || isChangingTrack) return;

    try {
        const live = findLiveSegment();

        const liveKey = getSegmentKey(live);

        if (liveKey !== currentSegmentKey) {
            driftStrikes = 0;
            await playLive();
            return;
        }

        updateRadioUI(live);
        updateLiveMediaSession();

        let audio;

        if (live.type === "interruption") {
            audio = interruptionAudio;
        } else if (live.type === "speech") {
            audio = speechAudio;
        } else {
            audio = musicAudio;
        }

        if (audio.ended || audio.seeking) return;

        const drift = Math.abs(
            audio.currentTime - live.offset
        );

        if (drift > 1.2) {
            driftStrikes++;

            if (driftStrikes >= 2 || force || drift > 4) {
                driftStrikes = 0;
                await seekAudio(audio, live.offset + startLatency);
            }
        } else {
            driftStrikes = 0;
        }

        scheduleInterruptionBoundary();

    } catch (error) {
        console.warn(
            "Periodic synchronization failed:",
            error
        );
    }

}

setInterval(syncRadio, 1000);

/* =====================================================
   MEDIA SESSION POSITION
   ===================================================== */

setInterval(() => {
    if (radioPlaying) {
        updateLiveMediaSession();
    }
}, 3000);

/* =====================================================
   VISIBILITY SYNCHRONIZATION
   ===================================================== */

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        syncClock();

        if (radioPlaying) {
            syncRadio(true);
        }
    }
});

/* =====================================================
   BLOCK TRACK-SKIPPING KEYS
   ===================================================== */

document.addEventListener("keydown", event => {
    const blocked = [
        "ArrowLeft",
        "ArrowRight",
        "Home",
        "End",
        "MediaTrackNext",
        "MediaTrackPrevious",
        "MediaFastForward",
        "MediaRewind"
    ];

    if (blocked.includes(event.key)) {
        event.preventDefault();
    }

});

/* =====================================================
   CONTEXT MENU
   ===================================================== */

document.addEventListener("contextmenu", event => {
    event.preventDefault();
});

/* =====================================================
   INITIAL UI
   ===================================================== */

updatePlayButton();

songNameElement.textContent =
    "Christmas Radio Ready";

upNextElement.textContent =
    "Loading playlist...";

/* =====================================================
   INITIALIZE RADIO
   ===================================================== */

async function initializeRadio() {
    try {
        await syncClock();

        await loadDurations();

        const live = findLiveSegment();

        currentSongIndex =
            getDisplaySongIndex(live);

        currentSegmentType = live.type;

        currentSegmentKey =
            getSegmentKey(live);

        updateRadioUI(live);
        updateLiveMediaSession();

        await cacheRadioAudio();

        console.log("Christmas Radio is ready.");

    } catch (error) {
        console.error(
            "Radio initialization failed:",
            error
        );

        songNameElement.textContent =
            "Radio unavailable";

        upNextElement.textContent =
            error.message;
    }

}

initializeRadio();

setInterval(syncClock, 10 * 60 * 1000);

/* =====================================================
   CLEANUP
   ===================================================== */

window.addEventListener("beforeunload", () => {
    musicAudio.pause();
    speechAudio.pause();
    interruptionAudio.pause();

    clearTimeout(segmentTimer);
    clearTimeout(interruptionBoundaryTimer);

    if (retryTimeout) {
        clearTimeout(retryTimeout);
    }

});


</script>
