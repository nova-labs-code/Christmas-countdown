<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="favicon.ico">

    <title>Christmas Countdown • Live Radio</title>

    <style>
    :root {
        --red: #d71920;
        --red-dark: #8d0710;
        --green: #0b6b3a;
        --green-dark: #063d25;
        --gold: #ffd76a;
        --white: #ffffff;

        --glass-bg: rgba(255, 255, 255, 0.075);
        --glass-bg-strong: rgba(255, 255, 255, 0.105);
        --glass-border: rgba(255, 255, 255, 0.25);
        --glass-highlight: rgba(255, 255, 255, 0.42);
        --glass-shadow: rgba(0, 0, 0, 0.42);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        -webkit-tap-highlight-color: transparent;

        user-select: none;
        -webkit-user-select: none;
    }

    html,
    body {
        width: 100%;
        height: 100%;

        overflow: hidden;

        touch-action: none;

        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;

        overscroll-behavior: none;
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            "Segoe UI",
            Arial,
            sans-serif;

        color: var(--white);

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(255, 255, 255, 0.08),
                transparent 25%
            ),
            radial-gradient(
                circle at 85% 80%,
                rgba(11, 107, 58, 0.30),
                transparent 35%
            ),
            radial-gradient(
                circle at 15% 80%,
                rgba(215, 25, 32, 0.28),
                transparent 35%
            ),
            #12030a;
    }

    /*
     * =====================================================
     * MAIN PAGE
     * =====================================================
     */

    #phonePortraitViewport {
        width: 100%;
        height: 100%;

        position: relative;

        overflow: hidden;
    }

    /*
     * =====================================================
     * BACKGROUND
     * =====================================================
     */

    #bg {
        position: absolute;

        inset: -4%;

        width: 108%;
        height: 108%;

        background-image:
            linear-gradient(
                rgba(15, 0, 5, 0.20),
                rgba(15, 0, 5, 0.48)
            ),
            url("christmas-background.jpg");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        filter:
            saturate(1.2)
            contrast(1.02);

        z-index: -5;

        transform: translateZ(0);
    }

    /*
     * =====================================================
     * SNOW
     * =====================================================
     */

    .snow-layer {
        position: absolute;

        inset: 0;

        pointer-events: none;

        overflow: hidden;
    }

    #snowFar,
    #snowMid,
    #snowNear {
        z-index: 2;
    }

    #snowAbove {
        z-index: 10;
    }

    .snowflake {
        position: absolute;

        top: -30px;

        color: rgba(255, 255, 255, 0.9);

        font-size: var(--size);

        opacity: var(--opacity);

        animation:
            smoothSnowFall
            var(--duration)
            linear
            infinite;

        animation-delay: var(--delay);

        will-change: transform;
    }

    .circle-snow {
        color: #ffffff;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-weight: 400;

        line-height: 1;

        text-shadow:
            0 0 5px
            rgba(255, 255, 255, 0.35);

        will-change:
            transform,
            opacity;
    }

    .circle-snow.far {
        filter:
            blur(0.25px);
    }

    .circle-snow.mid {
        filter:
            blur(0.1px);

        text-shadow:
            0 0 7px
            rgba(255, 255, 255, 0.45);
    }

    .circle-snow.near {
        text-shadow:
            0 0 9px
            rgba(255, 255, 255, 0.65),
            0 0 18px
            rgba(255, 255, 255, 0.25);
    }

    @keyframes smoothSnowFall {

        0% {
            transform:
                translate3d(
                    var(--drift-start),
                    -50px,
                    0
                );
        }

        12% {
            transform:
                translate3d(
                    var(--drift-one),
                    12vh,
                    0
                );
        }

        25% {
            transform:
                translate3d(
                    var(--drift-two),
                    25vh,
                    0
                );
        }

        37% {
            transform:
                translate3d(
                    var(--drift-three),
                    37vh,
                    0
                );
        }

        50% {
            transform:
                translate3d(
                    var(--drift-four),
                    50vh,
                    0
                );
        }

        62% {
            transform:
                translate3d(
                    var(--drift-five),
                    62vh,
                    0
                );
        }

        75% {
            transform:
                translate3d(
                    var(--drift-six),
                    75vh,
                    0
                );
        }

        87% {
            transform:
                translate3d(
                    var(--drift-seven),
                    87vh,
                    0
                );
        }

        100% {
            transform:
                translate3d(
                    var(--drift-end),
                    110vh,
                    0
                );
        }
    }

    /*
     * =====================================================
     * MAIN CONTAINER
     * =====================================================
     */

    #container {
        width: 100%;
        height: 100%;

        display: flex;

        align-items: center;
        justify-content: center;

        padding:
            max(20px, env(safe-area-inset-top))
            max(20px, env(safe-area-inset-right))
            max(20px, env(safe-area-inset-bottom))
            max(20px, env(safe-area-inset-left));

        position: absolute;

        inset: 0;

        z-index: 5;

        overflow: hidden;
    }

    /*
     * =====================================================
     * LIQUID GLASS CARD
     * =====================================================
     */

    .card {
        width: min(92vw, 900px);

        padding:
            clamp(30px, 5vw, 60px);

        text-align: center;

        position: relative;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.065),
                rgba(255, 255, 255, 0.018) 45%,
                rgba(255, 255, 255, 0.035)
            );

        border:
            1px solid
            rgba(255, 255, 255, 0.18);

        border-radius:
            32px;

        backdrop-filter:
            blur(14px)
            saturate(180%);

        -webkit-backdrop-filter:
            blur(14px)
            saturate(180%);

        box-shadow:
            0 35px 100px rgba(0, 0, 0, 0.42),
            0 10px 30px rgba(0, 0, 0, 0.18),
            inset 0 1px 0 rgba(255, 255, 255, 0.22),
            inset 1px 0 0 rgba(255, 255, 255, 0.07),
            inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }

    .card::before {
        content: "";

        position: absolute;

        inset: 1px;

        border-radius: 31px;

        pointer-events: none;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.08),
                transparent 40%
            );
    }

    .card::after {
        content: "";

        position: absolute;

        left: 10%;
        right: 10%;

        bottom: -18px;

        height: 35px;

        border-radius: 50%;

        background:
            rgba(255, 255, 255, 0.08);

        filter:
            blur(11px);

        pointer-events: none;

        z-index: -1;
    }

    .card > * {
        position: relative;

        z-index: 2;
    }

    /*
     * =====================================================
     * LIVE LABEL
     * =====================================================
     */

    .live-label {
        display: inline-flex;

        align-items: center;

        gap: 9px;

        padding:
            9px 17px;

        border-radius:
            999px;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.15),
                rgba(255, 255, 255, 0.055)
            );

        border:
            1px solid
            rgba(255, 255, 255, 0.22);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.28),

            0 5px 20px
                rgba(0, 0, 0, 0.12);

        backdrop-filter:
            blur(18px)
            saturate(160%);

        -webkit-backdrop-filter:
            blur(18px)
            saturate(160%);

        font-size:
            0.78rem;

        font-weight:
            800;

        letter-spacing:
            0.12em;

        text-transform:
            uppercase;

        margin-bottom:
            20px;
    }

    .live-dot {
        width: 9px;
        height: 9px;

        border-radius: 50%;

        background:
            #ff3038;

        box-shadow:
            0 0 8px #ff3038,
            0 0 16px
            rgba(255, 48, 56, 0.65);

        animation:
            livePulse
            1.4s
            infinite;
    }

    @keyframes livePulse {

        0%,
        100% {
            opacity: 1;

            transform:
                scale(1);
        }

        50% {
            opacity: 0.45;

            transform:
                scale(0.75);
        }
    }

    /*
     * =====================================================
     * CHRISTMAS TITLE
     * =====================================================
     */

    #title {
        font-size:
            clamp(3rem, 9vw, 7rem);

        font-weight:
            900;

        line-height:
            0.95;

        margin:
            0 0 10px;

        background:
            linear-gradient(
                105deg,
                #ff2933 0%,
                #d71920 30%,
                #0fa15a 58%,
                #0b6b3a 82%,
                #16a864 100%
            );

        -webkit-background-clip:
            text;

        -webkit-text-fill-color:
            transparent;

        background-clip:
            text;

        text-shadow:
            0 8px 30px
            rgba(0, 0, 0, 0.25);
    }

    /*
     * =====================================================
     * COUNTDOWN TITLE
     * =====================================================
     */

    #subtitle {
        font-size:
            clamp(2rem, 5vw, 4rem);

        line-height:
            1;

        font-weight:
            800;

        color:
            #ffffff;

        text-shadow:
            0 5px 25px
            rgba(0, 0, 0, 0.4);

        margin-bottom:
            28px;
    }

    /*
     * =====================================================
     * COUNTDOWN GLASS
     * =====================================================
     */

    #countdown {
        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        min-width:
            min(90%, 500px);

        padding:
            15px 25px;

        border-radius:
            999px;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.13),
                rgba(255, 255, 255, 0.045)
            );

        border:
            1px solid
            rgba(255, 255, 255, 0.24);

        backdrop-filter:
            blur(11px)
            saturate(180%);

        -webkit-backdrop-filter:
            blur(11px)
            saturate(180%);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.35),

            inset 0 -1px 0
                rgba(255, 255, 255, 0.07),

            0 12px 35px
                rgba(0, 0, 0, 0.20);

        font-size:
            clamp(1.1rem, 3vw, 1.7rem);

        font-weight:
            800;

        letter-spacing:
            0.03em;

        margin-bottom:
            30px;
    }

    /*
     * =====================================================
     * NOW PLAYING
     * =====================================================
     */

    .song-wrapper {
        margin-bottom:
            28px;
    }

    .now-playing {
        font-size:
            0.72rem;

        font-weight:
            800;

        text-transform:
            uppercase;

        letter-spacing:
            0.18em;

        opacity:
            0.72;

        margin-bottom:
            9px;
    }

    #songName {
        min-height:
            1.5em;

        font-size:
            clamp(1rem, 3vw, 1.45rem);

        font-weight:
            700;

        color:
            #ffffff;

        text-shadow:
            0 2px 12px
            rgba(0, 0, 0, 0.45);
    }

    .up-next-wrapper {
        margin-top:
            14px;

        margin-bottom:
            4px;
    }

    .up-next-label {
        font-size:
            0.62rem;

        font-weight:
            800;

        text-transform:
            uppercase;

        letter-spacing:
            0.16em;

        opacity:
            0.52;

        margin-bottom:
            5px;
    }

    #upNext {
        min-height:
            1.3em;

        font-size:
            clamp(0.85rem, 2.5vw, 1rem);

        font-weight:
            700;

        color:
            rgba(255, 255, 255, 0.78);

        text-shadow:
            0 2px 10px
            rgba(0, 0, 0, 0.35);
    }

    /*
     * =====================================================
     * PLAY BUTTON
     * =====================================================
     */

    #playButton {
        position:
            relative;

        overflow:
            hidden;

        border:
            1px solid
            rgba(255, 255, 255, 0.25);

        outline:
            none;

        padding:
            15px 28px;

        border-radius:
            999px;

        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.20),
                rgba(215, 25, 32, 0.42),
                rgba(141, 7, 16, 0.55)
            );

        color:
            white;

        font-size:
            1rem;

        font-weight:
            800;

        cursor:
            pointer;

        touch-action:
            manipulation;

        backdrop-filter:
            blur(20px)
            saturate(170%);

        -webkit-backdrop-filter:
            blur(20px)
            saturate(170%);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.4),

            inset 0 -1px 0
                rgba(0, 0, 0, 0.15),

            0 12px 35px
                rgba(120, 0, 0, 0.28);

        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease;
    }

    #playButton::before {
        content:
            "";

        position:
            absolute;

        top:
            0;

        left:
            -40%;

        width:
            35%;

        height:
            100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.30),
                transparent
            );

        transform:
            skewX(-20deg);

        transition:
            left 0.65s ease;
    }

    #playButton:hover::before {
        left:
            110%;
    }

    #playButton:active {
        transform:
            scale(0.96);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.3),

            0 5px 18px
                rgba(0, 0, 0, 0.25);
    }

    #playButton:hover {
        transform:
            translateY(-2px);

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.45),

            0 16px 40px
                rgba(120, 0, 0, 0.34);
    }

    #playButton.paused {
        background:
            linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.18),
                rgba(13, 122, 67, 0.45),
                rgba(7, 85, 47, 0.55)
            );

        box-shadow:
            inset 0 1px 0
                rgba(255, 255, 255, 0.4),

            0 12px 35px
                rgba(0, 80, 40, 0.25);
    }

    /*
     * =====================================================
     * FOOTER
     * =====================================================
     */

    footer {
        margin-top:
            28px;

        font-size:
            0.78rem;

        font-weight:
            700;

        opacity:
            0.65;

        letter-spacing:
            0.08em;
    }

    audio {
        display:
            none !important;
    }

    /*
     * =====================================================
     * MOBILE PORTRAIT
     * =====================================================
     */

    @media (max-width: 768px) {

        #container {
            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));
        }

        .card {
            width:
                94vw;

            padding:
                30px 20px;

            border-radius:
                28px;

            backdrop-filter:
                blur(12.5px)
                saturate(180%);

            -webkit-backdrop-filter:
                blur(12.5px)
                saturate(180%);
        }

        .card::before {
            border-radius:
                27px;
        }

        #countdown {
            min-width:
                0;

            width:
                100%;

            padding:
                13px 15px;

            margin-bottom:
                24px;
        }

        #songName {
            padding:
                0 8px;
        }

        #playButton {
            width:
                min(100%, 330px);
        }

        footer {
            margin-top:
                22px;
        }
    }

    /*
     * =====================================================
     * PHONE LANDSCAPE
     * =====================================================
     */

    @media (max-width: 900px) and (orientation: landscape) {

        #container {
            padding:
                max(8px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));
        }

        .card {
            width:
                min(
                    94vw,
                    850px
                );

            height:
                min(
                    92dvh,
                    440px
                );

            min-height:
                0;

            padding:
                clamp(12px, 3vh, 22px)
                clamp(18px, 4vw, 38px);

            border-radius:
                25px;

            overflow:
                hidden;

            display:
                grid;

            grid-template-columns:
                minmax(0, 1.15fr)
                minmax(0, 0.95fr);

            grid-template-rows:
                auto
                auto
                auto
                auto;

            grid-template-areas:
                "live live"
                "title info"
                "subtitle info"
                "countdown button";

            column-gap:
                clamp(18px, 5vw, 48px);

            row-gap:
                clamp(2px, 0.8vh, 7px);

            align-items:
                center;

            justify-content:
                center;

            backdrop-filter:
                blur(14px)
                saturate(180%);

            -webkit-backdrop-filter:
                blur(14px)
                saturate(180%);
        }

        .card::before {
            border-radius:
                24px;
        }

        .live-label {
            grid-area:
                live;

            justify-self:
                center;

            padding:
                5px 12px;

            gap:
                7px;

            font-size:
                0.58rem;

            margin-bottom:
                2px;
        }

        .live-dot {
            width:
                7px;

            height:
                7px;
        }

        #title {
            grid-area:
                title;

            font-size:
                clamp(
                    2.25rem,
                    9.5vh,
                    4.4rem
                );

            line-height:
                0.86;

            margin:
                0;

            white-space:
                nowrap;
        }

        #subtitle {
            grid-area:
                subtitle;

            font-size:
                clamp(
                    1.45rem,
                    5.5vh,
                    2.5rem
                );

            line-height:
                0.9;

            margin:
                0;

            white-space:
                nowrap;
        }

        #countdown {
            grid-area:
                countdown;

            justify-self:
                center;

            width:
                100%;

            min-width:
                0;

            max-width:
                100%;

            padding:
                8px 12px;

            margin:
                2px 0 0;

            font-size:
                clamp(
                    0.72rem,
                    3.2vh,
                    1.05rem
                );

            white-space:
                nowrap;
        }

        .song-wrapper {
            grid-area:
                info;

            width:
                100%;

            min-width:
                0;

            margin:
                0;

            padding:
                0 2px;

            text-align:
                center;
        }

        .now-playing {
            font-size:
                0.55rem;

            letter-spacing:
                0.16em;

            margin-bottom:
                4px;

            opacity:
                0.68;
        }

        #songName {
            min-height:
                1.2em;

            padding:
                0;

            font-size:
                clamp(
                    0.82rem,
                    3.2vh,
                    1.1rem
                );

            line-height:
                1.15;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        .up-next-wrapper {
            margin:
                7px 0 0;
        }

        .up-next-label {
            font-size:
                0.47rem;

            letter-spacing:
                0.14em;

            margin-bottom:
                2px;
        }

        #upNext {
            min-height:
                1.1em;

            font-size:
                clamp(
                    0.64rem,
                    2.5vh,
                    0.86rem
                );

            line-height:
                1.1;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }

        #playButton {
            grid-area:
                button;

            justify-self:
                center;

            width:
                min(
                    100%,
                    250px
                );

            min-width:
                0;

            padding:
                8px 16px;

            font-size:
                clamp(
                    0.68rem,
                    2.7vh,
                    0.88rem
                );

            white-space:
                nowrap;
        }

        footer {
            position:
                absolute;

            left:
                50%;

            bottom:
                7px;

            transform:
                translateX(-50%);

            margin:
                0;

            font-size:
                clamp(
                    0.45rem,
                    1.8vh,
                    0.6rem
                );

            white-space:
                nowrap;

            opacity:
                0.55;
        }
    }

    /*
     * =====================================================
     * VERY SHORT LANDSCAPE PHONES
     * =====================================================
     */

    @media (max-width: 900px)
        and (orientation: landscape)
        and (max-height: 430px) {

        #container {
            padding:
                5px 10px;
        }

        .card {
            width:
                min(
                    95vw,
                    850px
                );

            height:
                calc(
                    100dvh -
                    env(safe-area-inset-top) -
                    env(safe-area-inset-bottom) -
                    10px
                );

            padding:
                8px 16px;

            border-radius:
                21px;

            grid-template-columns:
                minmax(0, 1.15fr)
                minmax(0, 0.95fr);

            column-gap:
                20px;

            row-gap:
                1px;
        }

        .card::before {
            border-radius:
                20px;
        }

        .live-label {
            padding:
                3px 9px;

            gap:
                5px;

            font-size:
                0.48rem;
        }

        .live-dot {
            width:
                6px;

            height:
                6px;
        }

        #title {

    <script>


"use strict";

/* =========================================
   SERVICE WORKER
========================================= */

let serviceWorkerRegistration = null;

const serviceWorkerPromise = ("serviceWorker" in navigator)
    ? navigator.serviceWorker.register("./service-worker.js")
        .then(registration => {
            serviceWorkerRegistration = registration;
            console.log("Service worker registered:", registration.scope);
            return registration;
        })
        .catch(error => {
            console.error("Service worker registration failed:", error);
            return null;
        })
    : Promise.resolve(null);


/* =========================================
   MOBILE GESTURE PREVENTION
========================================= */

let lastTouchEnd = 0;

document.addEventListener("touchend", event => {
    const now = Date.now();

    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }

    lastTouchEnd = now;
}, { passive: false });

["gesturestart", "gesturechange", "gestureend"].forEach(eventName => {
    document.addEventListener(eventName, event => {
        event.preventDefault();
    }, { passive: false });
});


/* =========================================
   ELEMENTS
========================================= */

const musicAudio = document.getElementById("musicAudio");
const speechAudio = document.getElementById("speechAudio");
const playButton = document.getElementById("playButton");
const songNameElement = document.getElementById("songName");
const upNextElement = document.getElementById("upNext");
const countdownElement = document.getElementById("countdown");


/* =========================================
   RADIO CONFIGURATION
========================================= */

const SONG_FOLDER = "./songs/";
const SPEECH_SRC = "./songs/speech.mp3";

const DURATION_MANIFEST = "./songs/durations.json";

const SONGS_PER_SPEECH = 4;
const DURATION_TIMEOUT = 30000;

const SIGNATURE_STORAGE_KEY = "christmasRadioContentSignature";

// Fixed instant: midnight Eastern Standard Time (UTC-5), the same
// moment on every device worldwide
const RADIO_START = Date.parse("2025-12-01T00:00:00-05:00");

const EASTERN_ZONE = "America/New_York";




/* =========================================
   STATE
========================================= */

let songs = [];
let speechDuration = 0;
let totalPlaylistDuration = 0;

let metadataLoaded = false;
let metadataLoadingPromise = null;

let radioPlaying = false;
let currentSongIndex = 0;
let currentSegmentType = "song";
let currentSegmentKey = "";

let isChangingTrack = false;
let retryCount = 0;
let retryTimeout = null;

let contentSignature = "";

let segmentTimer = null;
let driftStrikes = 0;


/* =========================================
   TIME FORMAT
========================================= */

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
    }

    seconds = Math.floor(seconds);

    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const remainingSeconds = seconds % 60;

    if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
}


/* =========================================
   LOAD durations.json

   Format:
   {
     "songs": [
       { "file": "song.mp3", "name": "Song (Artist)", "duration": 164.013 }
     ]
   }

   Optional, recommended: add the speech length
   so every device uses the same value:
     "speech": 40.5
========================================= */

async function fetchJSON(path) {
    const response = await fetch(path, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            `Could not load ${path} (${response.status}).`
        );
    }

    return response.json();
}

function parseSongs(data) {
    if (!data || !Array.isArray(data.songs)) {
        throw new Error(
            "durations.json must contain a 'songs' array."
        );
    }

    const parsed = data.songs.map((entry, index) => {
        if (!entry || typeof entry !== "object") {
            throw new Error(`Invalid song entry at index ${index}.`);
        }

        const name = String(entry.name ?? "").trim();
        const file = String(entry.file ?? "").trim();
        const duration = Number(entry.duration);

        if (!name) {
            throw new Error(`Song ${index + 1} is missing its name.`);
        }

        if (!file) {
            throw new Error(
                `"${name}" is missing its file in durations.json.`
            );
        }

        if (!Number.isFinite(duration) || duration <= 0) {
            throw new Error(
                `"${name}" has an invalid duration in durations.json.`
            );
        }

        return { name, file, duration };
    });

    if (parsed.length === 0) {
        throw new Error("durations.json contains no songs.");
    }

    return parsed;
}


/* =========================================
   SPEECH DURATION

   Uses the value in durations.json when it is
   there ("speech": 40.5). Otherwise reads it
   from speech.mp3. A listed value is better:
   if a device could not read the file, its
   timeline would drift from everyone else's.
========================================= */

async function loadSpeechDuration(data) {
    const listed = Number(
        data.speech ??
        data["speech.mp3"] ??
        data.speechDuration
    );

    if (Number.isFinite(listed) && listed > 0) {
        return listed;
    }

    try {
        const probe = new Audio();

        probe.preload = "metadata";
        probe.src = SPEECH_SRC;
        probe.load();

        await waitForAudioMetadata(probe);

        if (
            Number.isFinite(probe.duration) &&
            probe.duration > 0
        ) {
            return probe.duration;
        }
    } catch (error) {
        console.warn(
            "Could not read speech duration. Add \"speech\" to durations.json:",
            error
        );
    }

    return 0;
}


/* =========================================
   CALCULATE PLAYLIST DURATION
========================================= */

function calculatePlaylistDuration() {
    let duration = 0;

    for (let i = 0; i < songs.length; i++) {
        duration += songs[i].duration;

        if (
            (i + 1) % SONGS_PER_SPEECH === 0 &&
            speechDuration > 0
        ) {
            duration += speechDuration;
        }
    }

    return duration;
}


/* =========================================
   CONTENT SIGNATURE

   Changes whenever a song name, file,
   duration or the speech duration changes.
   Built from the unshuffled list (sorted),
   so the daily shuffle never triggers it.
========================================= */

function computeContentSignature(loadedSongs, speechSeconds) {
    const text = loadedSongs
        .map(song => `${song.file}|${song.name}|${song.duration}`)
        .sort()
        .join("\n") + `\nspeech|${speechSeconds}`;

    let hash = 2166136261;

    for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }

    return (hash >>> 0).toString(16) + "-" + text.length;
}

function getSavedSignature() {
    try {
        return localStorage.getItem(SIGNATURE_STORAGE_KEY);
    } catch {
        return null;
    }
}

function saveSignature(signature) {
    try {
        localStorage.setItem(SIGNATURE_STORAGE_KEY, signature);
    } catch {}
}


/* =========================================
   LOAD ALL METADATA
========================================= */

async function loadDurations() {
    if (metadataLoaded) {
        return songs;
    }

    if (metadataLoadingPromise) {
        return metadataLoadingPromise;
    }

    metadataLoadingPromise = (async () => {
        const data = await fetchJSON(DURATION_MANIFEST);

        songs = parseSongs(data);

        speechDuration = await loadSpeechDuration(data);

        contentSignature = computeContentSignature(
            songs,
            speechDuration
        );

        totalPlaylistDuration = calculatePlaylistDuration();

        if (
            !Number.isFinite(totalPlaylistDuration) ||
            totalPlaylistDuration <= 0
        ) {
            throw new Error("No valid playlist duration was found.");
        }

        metadataLoaded = true;

        console.log("Loaded songs:", songs.length);
        console.log("Speech duration:", formatTime(speechDuration));
        console.log(
            "Total radio timeline:",
            formatTime(totalPlaylistDuration)
        );

        return songs;

    })().catch(error => {
        metadataLoaded = false;
        metadataLoadingPromise = null;

        console.error("Playlist loading failed:", error);

        throw error;
    });

    return metadataLoadingPromise;
}


/* =========================================
   CHRISTMAS COUNTDOWN
========================================= */

const easternYearFormatter = new Intl.DateTimeFormat("en-US", {
    timeZone: EASTERN_ZONE,
    year: "numeric"
});

function updateCountdown() {
    const now = Date.now();

    const year = Number(easternYearFormatter.format(new Date(now)));

    // Midnight on December 25 Eastern Standard Time (UTC-5)
    let christmas = Date.parse(`${year}-12-25T00:00:00-05:00`);

    if (now >= christmas) {
        christmas = Date.parse(`${year + 1}-12-25T00:00:00-05:00`);
    }

    const seconds = Math.max(
        0,
        Math.floor((christmas - now) / 1000)
    );

    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    countdownElement.textContent =
        `${days}d ${hours}h ${minutes}m ${secs}s`;
}

updateCountdown();

setInterval(updateCountdown, 1000);


/* =========================================
   SNOW DRIFT
========================================= */

function setSnowDrift(snowflake, driftAmount) {
    const center = (Math.random() - 0.5) * driftAmount;
    const swing = 8 + Math.random() * (driftAmount * 0.55);
    const direction = Math.random() > 0.5 ? 1 : -1;

    const positions = {
        "--drift-start": center - swing * direction,
        "--drift-one": center + swing * .25 * direction,
        "--drift-two": center + swing * direction,
        "--drift-three": center + swing * .35 * direction,
        "--drift-four": center - swing * .45 * direction,
        "--drift-five": center - swing * direction,
        "--drift-six": center - swing * .30 * direction,
        "--drift-seven": center + swing * .55 * direction,
        "--drift-end": center + swing * .15 * direction
    };

    for (const [property, value] of Object.entries(positions)) {
        snowflake.style.setProperty(
            property,
            `${value}px`
        );
    }
}


/* =========================================
   CREATE SNOWFLAKES
========================================= */

function createSnowflakes(container, amount) {
    for (let i = 0; i < amount; i++) {
        const snowflake = document.createElement("div");

        snowflake.className = "snowflake";
        snowflake.textContent =
            Math.random() > .5 ? "❄" : "•";

        snowflake.style.left = `${Math.random() * 100}%`;

        snowflake.style.setProperty(
            "--size",
            `${8 + Math.random() * 14}px`
        );

        snowflake.style.setProperty(
            "--opacity",
            `${.25 + Math.random() * .65}`
        );

        snowflake.style.setProperty(
            "--duration",
            `${7 + Math.random() * 12}s`
        );

        snowflake.style.setProperty(
            "--delay",
            `${-Math.random() * 15}s`
        );

        setSnowDrift(snowflake, 50);

        container.appendChild(snowflake);
    }
}


/* =========================================
   CREATE CIRCLE SNOW
========================================= */

function createCircleSnow(container, amount, depth) {
    for (let i = 0; i < amount; i++) {
        const snowflake = document.createElement("div");

        snowflake.className =
            `snowflake circle-snow ${depth}`;

        snowflake.textContent = "•";

        let minSize;
        let maxSize;
        let minOpacity;
        let maxOpacity;
        let minDuration;
        let maxDuration;
        let driftAmount;

        if (depth === "far") {
            minSize = 3;
            maxSize = 7;
            minOpacity = .18;
            maxOpacity = .42;
            minDuration = 10;
            maxDuration = 20;
            driftAmount = 35;

        } else if (depth === "mid") {
            minSize = 5;
            maxSize = 11;
            minOpacity = .35;
            maxOpacity = .68;
            minDuration = 8;
            maxDuration = 16;
            driftAmount = 50;

        } else {
            minSize = 8;
            maxSize = 17;
            minOpacity = .55;
            maxOpacity = .95;
            minDuration = 6;
            maxDuration = 13;
            driftAmount = 65;
        }

        const size =
            minSize + Math.random() * (maxSize - minSize);

        const opacity =
            minOpacity + Math.random() * (maxOpacity - minOpacity);

        const duration =
            minDuration + Math.random() * (maxDuration - minDuration);

        snowflake.style.left = `${Math.random() * 100}%`;
        snowflake.style.setProperty("--size", `${size}px`);
        snowflake.style.setProperty("--opacity", opacity);
        snowflake.style.setProperty("--duration", `${duration}s`);

        snowflake.style.setProperty(
            "--delay",
            `${-Math.random() * duration}s`
        );

        snowflake.style.top =
            `${-20 - Math.random() * 100}px`;

        setSnowDrift(snowflake, driftAmount);

        let aboveChance;

        if (depth === "far") {
            aboveChance = .08;
        } else if (depth === "mid") {
            aboveChance = .40;
        } else {
            aboveChance = .70;
        }

        if (Math.random() < aboveChance) {
            document
                .getElementById("snowAbove")
                .appendChild(snowflake);
        } else {
            container.appendChild(snowflake);
        }
    }
}


/* =========================================
   INITIALIZE SNOW
========================================= */

createSnowflakes(
    document.getElementById("snowFar"),
    20
);

createSnowflakes(
    document.getElementById("snowMid"),
    15
);

createSnowflakes(
    document.getElementById("snowNear"),
    10
);

createCircleSnow(
    document.getElementById("snowFar"),
    45,
    "far"
);

createCircleSnow(
    document.getElementById("snowMid"),
    38,
    "mid"
);

createCircleSnow(
    document.getElementById("snowNear"),
    28,
    "near"
);


/* =========================================
   OFFLINE AUDIO CACHING

   If songs or durations changed since the
   last completed caching run, the service
   worker wipes the audio cache and downloads
   everything again. The new signature is only
   saved once the worker reports that every
   file downloaded, so an interrupted refresh
   is retried on the next visit.
========================================= */

async function cacheRadioAudio() {
    if (!("serviceWorker" in navigator)) {
        console.warn("Service workers are not supported.");
        return;
    }

    try {
        const registration =
            serviceWorkerRegistration ||
            await serviceWorkerPromise ||
            await navigator.serviceWorker.ready;

        if (!registration) return;

        const activeWorker =
            registration.active ||
            registration.waiting ||
            registration.installing;

        if (!activeWorker) {
            console.warn("No service worker is available.");
            return;
        }

        // Start with the song that is playing now, so it is cached first
        const startIndex = getDisplaySongIndex(findLiveSegment());

        const songURLs = songs.map((_, i) => {
            const song = songs[(startIndex + i) % songs.length];
            return SONG_FOLDER + encodeURIComponent(song.file);
        });

        // Only cache the speech file if durations.json lists it
        const files = [
            songURLs[0],
            ...(speechDuration > 0 ? [SPEECH_SRC] : []),
            ...songURLs.slice(1)
        ];

        const contentChanged =
            getSavedSignature() !== contentSignature;

        if (contentChanged) {
            activeWorker.postMessage({
                type: "REFRESH_RADIO_AUDIO",
                files,
                signature: contentSignature
            });

            console.log(
                "Playlist changed. Re-caching all audio:",
                files.length,
                "files"
            );
        } else {
            activeWorker.postMessage({
                type: "CACHE_RADIO_AUDIO",
                files
            });

            console.log(
                "Offline audio caching requested:",
                files.length,
                "files"
            );
        }

    } catch (error) {
        console.error(
            "Could not start offline caching:",
            error
        );
    }
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", event => {
        const data = event.data || {};

        if (data.type === "RADIO_AUDIO_CACHE_FINISHED") {
            console.log(
                `Audio caching finished: ${data.completed}/${data.total}` +
                (data.failed ? `, ${data.failed} failed` : "")
            );

            // Remember the new playlist once the refresh has run, so it
            // happens once per change. Files that failed are fetched
            // by the normal caching run on the next visit.
            if (data.refreshed && data.signature) {
                saveSignature(data.signature);
            }
        }
    });
}





/* =========================================
   FIND LIVE SEGMENT
========================================= */

function findLiveSegment() {
    if (
        !metadataLoaded ||
        totalPlaylistDuration <= 0
    ) {
        return {
            type: "song",
            index: 0,
            offset: 0,
            length: 0
        };
    }

    const elapsed = Math.max(
        0,
        (Date.now() - RADIO_START) / 1000
    );

    const position = elapsed % totalPlaylistDuration;

    let accumulated = 0;

    for (let i = 0; i < songs.length; i++) {
        const duration = songs[i].duration;

        if (position < accumulated + duration) {
            return {
                type: "song",
                index: i,
                offset: position - accumulated,
                length: duration
            };
        }

        accumulated += duration;

        if (
            (i + 1) % SONGS_PER_SPEECH === 0 &&
            speechDuration > 0
        ) {
            if (position < accumulated + speechDuration) {
                return {
                    type: "speech",
                    index: i,
                    offset: position - accumulated,
                    length: speechDuration
                };
            }

            accumulated += speechDuration;
        }
    }

    return {
        type: "song",
        index: 0,
        offset: 0,
        length: 0
    };
}


/* =========================================
   DISPLAY SONG INDEX
========================================= */

function getDisplaySongIndex(segment) {
    if (segment.type === "speech") {
        return (segment.index + 1) % songs.length;
    }

    return segment.index;
}

function getDisplayNextSongIndex(segment) {
    return (
        getDisplaySongIndex(segment) + 1
    ) % songs.length;
}


/* =========================================
   UPDATE RADIO UI
========================================= */

function updateRadioUI(segment) {
    if (!songs.length) return;

    const current = getDisplaySongIndex(segment);
    const next = getDisplayNextSongIndex(segment);

    songNameElement.textContent =
        songs[current].name;

    upNextElement.textContent =
        songs[next].name;
}


/* =========================================
   MEDIA SESSION
========================================= */

function updateLiveMediaSession() {
    if (
        !("mediaSession" in navigator) ||
        !metadataLoaded ||
        !songs.length
    ) {
        return;
    }

    const segment = findLiveSegment();

    const title = segment.type === "speech"
        ? "Christmas Radio"
        : songs[segment.index].name;

    try {
        navigator.mediaSession.metadata = new MediaMetadata({
            title,
            artist: "Christmas Countdown Radio",
            album: "Christmas Countdown",
            artwork: [{
                src: "./favicon.ico",
                sizes: "512x512",
                type: "image/x-icon"
            }]
        });
    } catch {}

    try {
        const audio = segment.type === "speech"
            ? speechAudio
            : musicAudio;

        const duration = audio.duration;
        const position = audio.currentTime;

        if (
            Number.isFinite(duration) &&
            duration > 0 &&
            Number.isFinite(position) &&
            position >= 0 &&
            position <= duration
        ) {
            navigator.mediaSession.setPositionState({
                duration,
                playbackRate: audio.playbackRate || 1,
                position
            });
        }
    } catch {}
}


/* =========================================
   MEDIA SESSION SETUP
========================================= */

function setupMediaSession() {
    if (!("mediaSession" in navigator)) return;

    try {
        navigator.mediaSession.setActionHandler(
            "play",
            () => resumeLive()
        );
    } catch {}

    try {
        navigator.mediaSession.setActionHandler(
            "pause",
            pauseRadio
        );
    } catch {}

    [
        "previoustrack",
        "nexttrack",
        "seekbackward",
        "seekforward",
        "seekto"
    ].forEach(action => {
        try {
            navigator.mediaSession.setActionHandler(
                action,
                () => {}
            );
        } catch {}
    });
}

setupMediaSession();


/* =========================================
   AUDIO METADATA WAITING
========================================= */

function waitForAudioMetadata(audio) {
    if (
        audio.readyState >= 1 &&
        Number.isFinite(audio.duration)
    ) {
        return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
        let finished = false;

        const timeout = setTimeout(() => {
            finish(
                new Error("Audio metadata timed out.")
            );
        }, DURATION_TIMEOUT);

        function cleanup() {
            clearTimeout(timeout);

            audio.removeEventListener(
                "loadedmetadata",
                onLoaded
            );

            audio.removeEventListener(
                "error",
                onError
            );
        }

        function finish(error) {
            if (finished) return;

            finished = true;
            cleanup();

            if (error) {
                reject(error);
            } else {
                resolve();
            }
        }

        function onLoaded() {
            finish();
        }

        function onError() {
            finish(
                new Error("Could not load audio metadata.")
            );
        }

        audio.addEventListener(
            "loadedmetadata",
            onLoaded,
            { once: true }
        );

        audio.addEventListener(
            "error",
            onError,
            { once: true }
        );
    });
}


/* =========================================
   LOAD AUDIO

   The metadata wait is started AFTER the new
   source is set and load() has reset the
   element. (Before, it was started first, saw
   the previous song's metadata and returned
   instantly, so the start position was
   skipped.)
========================================= */

async function loadAudio(audio, src) {
    const absoluteURL = new URL(
        src,
        location.href
    ).href;

    if (audio.src !== absoluteURL) {
        audio.src = src;
        audio.load();
    }

    await waitForAudioMetadata(audio);
}


/* =========================================
   SEEK AND WAIT UNTIL THE SEEK FINISHES
========================================= */

function seekAudio(audio, time) {
    return new Promise(resolve => {
        if (!Number.isFinite(audio.duration)) {
            resolve();
            return;
        }

        const target = Math.min(
            Math.max(0, time),
            Math.max(0, audio.duration - 0.25)
        );

        if (Math.abs(audio.currentTime - target) < 0.05) {
            resolve();
            return;
        }

        let done = false;

        const finish = () => {
            if (done) return;

            done = true;
            clearTimeout(timer);
            audio.removeEventListener("seeked", finish);
            resolve();
        };

        const timer = setTimeout(finish, 5000);

        audio.addEventListener("seeked", finish);

        audio.currentTime = target;
    });
}


/* =========================================
   LOAD SONG
========================================= */

async function loadSong(index) {
    const song = songs[index];

    if (!song || !song.file) {
        throw new Error(
            `Song ${index + 1} is missing its file.`
        );
    }

    await loadAudio(
        musicAudio,
        SONG_FOLDER + encodeURIComponent(song.file)
    );
}


/* =========================================
   LOAD SPEECH
========================================= */

async function loadSpeech() {
    await loadAudio(speechAudio, SPEECH_SRC);
}


/* =========================================
   PLAY BUTTON STATE
========================================= */

function updatePlayButton() {
    if (radioPlaying) {
        playButton.textContent = "⏸ Pause";
        playButton.classList.remove("paused");
    } else {
        playButton.textContent = "▶️ Play";
        playButton.classList.add("paused");
    }
}


/* =========================================
   SEGMENT TIMER

   Used when a file ends slightly before the
   live clock reaches the next segment (or is
   shorter than durations.json says). Waits for
   the clock instead of restarting the file.
========================================= */

function scheduleAfterSegment(live) {
    clearTimeout(segmentTimer);

    const remaining = Math.max(
        0.1,
        (live.length || 0) - live.offset
    );

    segmentTimer = setTimeout(() => {
        if (radioPlaying) {
            playLive();
        }
    }, remaining * 1000 + 50);
}


/* =========================================
   LOAD THE CURRENT LIVE SEGMENT
========================================= */

async function prepareSegment(segment) {
    if (segment.type === "speech") {
        musicAudio.pause();
        await loadSpeech();
        return speechAudio;
    }

    speechAudio.pause();
    await loadSong(segment.index);
    return musicAudio;
}


/* =========================================
   START LIVE RADIO
========================================= */

async function playLive() {
    if (isChangingTrack) return;

    isChangingTrack = true;

    clearTimeout(segmentTimer);

    try {
        await loadDurations();

        let segment = findLiveSegment();
        let audio = null;

        // Loading takes time. If the live clock moved to another
        // segment meanwhile, load that one instead.
        for (let attempt = 0; attempt < 3; attempt++) {
            segment = findLiveSegment();

            audio = await prepareSegment(segment);

            const check = findLiveSegment();

            if (
                check.type === segment.type &&
                check.index === segment.index
            ) {
                break;
            }
        }

        // Use the position as it is NOW, after loading
        const live = findLiveSegment();

        currentSongIndex = getDisplaySongIndex(live);
        currentSegmentType = live.type;
        currentSegmentKey = `${live.type}:${live.index}`;

        updateRadioUI(live);

        radioPlaying = true;
        retryCount = 0;
        driftStrikes = 0;

        updatePlayButton();

        // File is shorter than durations.json says: wait for the clock
        if (live.offset >= audio.duration - 0.25) {
            console.warn(
                "Audio is shorter than its duration in durations.json:",
                audio.src
            );

            scheduleAfterSegment(live);
            return;
        }

        await seekAudio(audio, live.offset);
        await audio.play();

        // Compensate for the time spent seeking and starting
        const after = findLiveSegment();

        if (
            after.type === live.type &&
            after.index === live.index &&
            Math.abs(audio.currentTime - after.offset) > 0.75
        ) {
            await seekAudio(audio, after.offset);
        }

        updateLiveMediaSession();

        try {
            navigator.mediaSession.playbackState =
                "playing";
        } catch {}

    } catch (error) {
        console.error(
            "Could not start live radio:",
            error
        );

        radioPlaying = false;

        updatePlayButton();

        songNameElement.textContent =
            "Could not start radio";

        upNextElement.textContent =
            error.message;

    } finally {
        isChangingTrack = false;
    }
}


/* =========================================
   PAUSE RADIO
========================================= */

function pauseRadio() {
    clearTimeout(segmentTimer);

    musicAudio.pause();
    speechAudio.pause();

    radioPlaying = false;

    updatePlayButton();

    try {
        navigator.mediaSession.playbackState =
            "paused";
    } catch {}
}


/* =========================================
   RESUME RADIO
========================================= */

async function resumeLive() {
    if (radioPlaying) return;

    musicAudio.pause();
    speechAudio.pause();

    await playLive();
}


/* =========================================
   PLAY BUTTON
========================================= */

playButton.addEventListener("click", async () => {
    if (radioPlaying) {
        pauseRadio();
    } else {
        await resumeLive();
    }
});


/* =========================================
   TRACK END

   A file can end a moment before the live
   clock reaches the next segment. Restarting
   playLive() then would replay the same song
   from the start, so wait for the clock.
========================================= */

async function handleTrackEnded() {
    if (!radioPlaying || isChangingTrack) return;

    const live = findLiveSegment();

    if (`${live.type}:${live.index}` === currentSegmentKey) {
        scheduleAfterSegment(live);
        return;
    }

    await playLive();
}

musicAudio.addEventListener("ended", handleTrackEnded);
speechAudio.addEventListener("ended", handleTrackEnded);


/* =========================================
   ERROR RECOVERY
========================================= */

function retryLive() {
    if (!radioPlaying) return;

    if (retryTimeout) {
        clearTimeout(retryTimeout);
    }

    if (retryCount >= 3) {
        console.error(
            "Radio stopped after repeated playback errors."
        );

        pauseRadio();

        songNameElement.textContent =
            "Radio playback stopped";

        upNextElement.textContent =
            "Please try playing again.";

        return;
    }

    retryCount++;

    retryTimeout = setTimeout(() => {
        if (radioPlaying) {
            playLive();
        }
    }, 1500);
}

musicAudio.addEventListener("error", retryLive);
speechAudio.addEventListener("error", retryLive);


/* =========================================
   LIVE SYNCHRONIZATION

   Only seeks after drift was seen on two
   checks in a row, and never while the audio
   is seeking or has just ended.
========================================= */

async function syncRadio(force = false) {
    if (!radioPlaying || isChangingTrack) return;

    try {
        const live = findLiveSegment();

        const liveKey =
            `${live.type}:${live.index}`;

        if (liveKey !== currentSegmentKey) {
            driftStrikes = 0;
            await playLive();
            return;
        }

        updateRadioUI(live);
        updateLiveMediaSession();

        const audio = live.type === "speech"
            ? speechAudio
            : musicAudio;

        if (audio.ended || audio.seeking) return;

        const drift = Math.abs(
            audio.currentTime - live.offset
        );

        if (drift > 3) {
            driftStrikes++;

            if (driftStrikes >= 2 || force) {
                driftStrikes = 0;
                await seekAudio(audio, live.offset);
            }
        } else {
            driftStrikes = 0;
        }

    } catch (error) {
        console.warn(
            "Periodic synchronization failed:",
            error
        );
    }
}

setInterval(syncRadio, 5000);


/* =========================================
   MEDIA SESSION POSITION
========================================= */

setInterval(() => {
    if (radioPlaying) {
        updateLiveMediaSession();
    }
}, 3000);


/* =========================================
   VISIBILITY SYNCHRONIZATION
========================================= */

document.addEventListener("visibilitychange", () => {
    if (
        document.visibilityState === "visible" &&
        radioPlaying
    ) {
        syncRadio(true);
    }
});


/* =========================================
   BLOCK TRACK-SKIPPING KEYS
========================================= */

document.addEventListener("keydown", event => {
    const blocked = [
        "ArrowLeft",
        "ArrowRight",
        "Home",
        "End",
        "MediaTrackNext",
        "MediaTrackPrevious",
        "MediaFastForward",
        "MediaRewind"
    ];

    if (blocked.includes(event.key)) {
        event.preventDefault();
    }
});


/* =========================================
   CONTEXT MENU
========================================= */

document.addEventListener("contextmenu", event => {
    event.preventDefault();
});


/* =========================================
   INITIAL UI
========================================= */

updatePlayButton();

songNameElement.textContent =
    "Christmas Radio Ready";

upNextElement.textContent =
    "Loading playlist...";


/* =========================================
   INITIALIZE RADIO
========================================= */

async function initializeRadio() {
    try {
        await loadDurations();

        const live = findLiveSegment();

        currentSongIndex =
            getDisplaySongIndex(live);

        currentSegmentType = live.type;

        currentSegmentKey =
            `${live.type}:${live.index}`;

        updateRadioUI(live);
        updateLiveMediaSession();

        await cacheRadioAudio();

        console.log("Christmas Radio is ready.");

    } catch (error) {
        console.error(
            "Radio initialization failed:",
            error
        );

        songNameElement.textContent =
            "Radio unavailable";

        upNextElement.textContent =
            error.message;
    }
}

initializeRadio();


/* =========================================
   CLEANUP
========================================= */

window.addEventListener("beforeunload", () => {
    musicAudio.pause();
    speechAudio.pause();

    if (retryTimeout) {
        clearTimeout(retryTimeout);
    }
});


    </script>
