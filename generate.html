
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Christmas Radio Duration Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #12030a;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1d0710;
            border: 1px solid #4d1829;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .description {
            color: #c9aeb7;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px;
            background: #8b1e3f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a5264c;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #12030a;
            color: #d8c1c8;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #progress {
            width: 100%;
            height: 10px;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #35101d;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #b52b55;
            transition: width 0.15s ease;
        }

        .success {
            color: #8be28b;
        }

        .error {
            color: #ff8585;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Christmas Radio Duration Generator</h1>

        <div class="description">
            Loads song names and filenames from <strong>songs.json</strong>,
            checks each corresponding MP3 in the <strong>songs</strong> folder,
            reads its duration, and downloads a new <strong>durations.json</strong>.
        </div>

        <button id="generateButton">
            Generate durations.json
        </button>

        <div id="progress">
            <div id="progressBar"></div>
        </div>

        <div id="status">
            Ready to load songs.json.
        </div>

    </div>

    <script>
        "use strict";

        const SONG_MANIFEST = "./songs.json";
        const SONG_FOLDER = "./songs/";
        
        const generateButton =
            document.getElementById("generateButton");

        const status =
            document.getElementById("status");

        const progress =
            document.getElementById("progress");

        const progressBar =
            document.getElementById("progressBar");


        /*
         * Load songs from the new songs.json format.
         *
         * Expected:
         *
         * {
         *     "songs": [
         *         {
         *             "file": "Song File.mp3",
         *             "name": "Song Display Name"
         *         }
         *     ]
         * }
         */
        async function loadSongs() {

            const response = await fetch(
                SONG_MANIFEST,
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    `Could not load songs.json (${response.status})`
                );
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.songs)) {
                throw new Error(
                    "songs.json must contain a 'songs' array."
                );
            }

            const songs = data.songs
                .map(song => {

                    if (
                        !song ||
                        typeof song.file !== "string" ||
                        typeof song.name !== "string"
                    ) {
                        return null;
                    }

                    const file = song.file.trim();
                    const name = song.name.trim();

                    if (!file || !name) {
                        return null;
                    }

                    return {
                        file,
                        name
                    };
                })
                .filter(Boolean);

            if (songs.length === 0) {
                throw new Error(
                    "songs.json contains no valid songs."
                );
            }

            return songs;
        }


        /*
         * Create the URL for an MP3.
         *
         * Uses the exact filename from songs.json.
         */
        function getSongURL(filename) {

            return (
                SONG_FOLDER +
                filename
                    .split("/")
                    .map(part => encodeURIComponent(part))
                    .join("/")
            );
        }


        /*
         * Read the duration of an MP3.
         *
         * Used only by this generator.
         */
        function getDuration(filename) {

            return new Promise((resolve, reject) => {

                const audio = new Audio();

                let finished = false;

                const cleanup = () => {

                    audio.removeEventListener(
                        "loadedmetadata",
                        handleMetadata
                    );

                    audio.removeEventListener(
                        "error",
                        handleError
                    );

                    audio.removeAttribute("src");
                    audio.load();
                };


                const handleMetadata = () => {

                    if (finished) {
                        return;
                    }

                    finished = true;

                    const duration = audio.duration;

                    cleanup();

                    if (
                        !Number.isFinite(duration) ||
                        duration <= 0
                    ) {
                        reject(
                            new Error(
                                "Invalid audio duration"
                            )
                        );

                        return;
                    }

                    resolve(duration);
                };


                const handleError = () => {

                    if (finished) {
                        return;
                    }

                    finished = true;

                    cleanup();

                    reject(
                        new Error(
                            "Could not load audio"
                        )
                    );
                };


                audio.preload = "metadata";

                audio.addEventListener(
                    "loadedmetadata",
                    handleMetadata
                );

                audio.addEventListener(
                    "error",
                    handleError
                );

                audio.src = getSongURL(filename);

                audio.load();
            });
        }


        /*
         * Download a JSON file.
         */
        function downloadJSON(data, filename) {

            const json = JSON.stringify(
                data,
                null,
                2
            );

            const blob = new Blob(
                [json],
                {
                    type: "application/json"
                }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = filename;

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 1000);
        }


        /*
         * Generate durations.json.
         */
        async function generateDurations() {

            generateButton.disabled = true;

            progress.style.display = "block";
            progressBar.style.width = "0%";

            status.className = "";

            try {

                status.textContent =
                    "Loading songs from songs.json...";

                const songsManifest = await loadSongs();

                const total = songsManifest.length;

                status.textContent =
                    `Checking ${total} hosted songs...`;

                const songs = [];
                const failed = [];


                for (
                    let i = 0;
                    i < songsManifest.length;
                    i++
                ) {

                    const originalSong = songsManifest[i];

                    const file = originalSong.file;
                    const name = originalSong.name;

                    status.textContent =
                        `Checking ${i + 1} of ${total}\n\n${name}\n${file}`;


                    try {

                        const duration = await getDuration(file);

                        songs.push({
                            file,
                            name,
                            duration: Number(
                                duration.toFixed(3)
                            )
                        });

                    } catch (error) {

                        console.error(
                            `Failed to load ${file}:`,
                            error
                        );

                        songs.push({
                            file,
                            name,
                            duration: null,
                            error: true
                        });

                        failed.push({
                            name,
                            file
                        });
                    }


                    const percent =
                        ((i + 1) / total) * 100;

                    progressBar.style.width =
                        `${percent}%`;
                }


                /*
                 * Create the final durations.json.
                 */
                const output = {
                    songs
                };

                downloadJSON(
                    output,
                    "durations.json"
                );


                if (failed.length > 0) {

                    status.className = "error";

                    status.textContent =
                        `Finished with ${failed.length} failed song(s).\n\n` +
                        `durations.json has been downloaded.\n\n` +
                        `Failed songs:\n\n` +
                        failed.map(song =>
                            `${song.name}\n${song.file}`
                        ).join("\n\n");

                } else {

                    status.className = "success";

                    status.textContent =
                        `Successfully generated durations.json.\n\n` +
                        `${songs.length} songs processed.\n\n` +
                        `The file has been downloaded.`;
                }

            } catch (error) {

                console.error(error);

                status.className = "error";

                status.textContent =
                    `Error:\n\n${error.message}`;
            }

            generateButton.disabled = false;
        }


        generateButton.addEventListener(
            "click",
            generateDurations
        );

    </script>

</body>

</html>
