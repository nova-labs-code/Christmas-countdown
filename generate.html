
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Christmas Radio Duration Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #12030a;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1d0710;
            border: 1px solid #4d1829;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .description {
            color: #c9aeb7;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px;
            background: #8b1e3f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a5264c;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #12030a;
            color: #d8c1c8;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #progress {
            width: 100%;
            height: 10px;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #35101d;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #b52b55;
            transition: width 0.15s ease;
        }

        .success {
            color: #8be28b !important;
        }

        .error {
            color: #ff8585 !important;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Christmas Radio Duration Generator</h1>

        <div class="description">
            Loads songs from <strong>songs.json</strong>, loads each MP3
            from the <strong>songs</strong> folder, reads its duration,
            and downloads a new <strong>durations.json</strong>.
        </div>

        <button id="generateButton">
            Generate durations.json
        </button>

        <div id="progress">
            <div id="progressBar"></div>
        </div>

        <div id="status">
            Ready to load songs.json.
        </div>

    </div>

    <script>
        "use strict";

        const SONG_MANIFEST = "./songs.json";
        const SONG_FOLDER = "./songs/";

        const AUDIO_TIMEOUT = 60000;

        const generateButton =
            document.getElementById("generateButton");

        const status =
            document.getElementById("status");

        const progress =
            document.getElementById("progress");

        const progressBar =
            document.getElementById("progressBar");


        /*
         * Load songs.json.
         *
         * Expected format:
         *
         * {
         *     "songs": [
         *         {
         *             "file": "Song File.mp3",
         *             "name": "Song Display Name"
         *         }
         *     ]
         * }
         */
        async function loadSongs() {

            const response = await fetch(
                SONG_MANIFEST,
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    `Could not load songs.json (${response.status})`
                );
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.songs)) {
                throw new Error(
                    "songs.json must contain a 'songs' array."
                );
            }

            const songs = data.songs
                .map(song => {

                    if (
                        !song ||
                        typeof song.file !== "string" ||
                        typeof song.name !== "string"
                    ) {
                        return null;
                    }

                    const file = song.file.trim();
                    const name = song.name.trim();

                    if (!file || !name) {
                        return null;
                    }

                    return {
                        file,
                        name
                    };
                })
                .filter(Boolean);

            if (songs.length === 0) {
                throw new Error(
                    "songs.json contains no valid songs."
                );
            }

            return songs;
        }


        /*
         * Build the MP3 URL.
         *
         * Uses the exact filename from songs.json.
         */
        function getSongURL(filename) {

            return (
                SONG_FOLDER +
                filename
                    .split("/")
                    .map(part => encodeURIComponent(part))
                    .join("/")
            );
        }


        /*
         * Load the complete audio file.
         *
         * Wait for the browser to finish loading the
         * audio before reading its duration.
         */
        function getDuration(filename, onProgress) {

            return new Promise((resolve, reject) => {

                const audio = new Audio();

                let finished = false;

                audio.preload = "auto";


                const timeout = setTimeout(() => {

                    finish(
                        new Error("Audio loading timed out")
                    );

                }, AUDIO_TIMEOUT);


                function cleanup() {

                    audio.removeEventListener(
                        "loadedmetadata",
                        handleMetadata
                    );

                    audio.removeEventListener(
                        "canplaythrough",
                        handleLoaded
                    );

                    audio.removeEventListener(
                        "error",
                        handleError
                    );

                    audio.removeEventListener(
                        "progress",
                        handleProgress
                    );

                    clearTimeout(timeout);

                    audio.pause();
                    audio.removeAttribute("src");
                    audio.load();
                }


                function finish(error, duration) {

                    if (finished) return;

                    finished = true;

                    cleanup();

                    if (error) {
                        reject(error);
                    } else {
                        resolve(duration);
                    }
                }


                function handleMetadata() {

                    const duration = audio.duration;

                    if (
                        !Number.isFinite(duration) ||
                        duration <= 0
                    ) {
                        finish(
                            new Error("Invalid audio duration")
                        );

                        return;
                    }

                    /*
                     * The browser has loaded the metadata.
                     * Now wait until the complete file is loaded.
                     */
                    if (audio.readyState >= 4) {
                        finish(null, duration);
                    }
                }


                function handleLoaded() {

                    const duration = audio.duration;

                    if (
                        Number.isFinite(duration) &&
                        duration > 0
                    ) {
                        finish(null, duration);
                    }
                }


                function handleError() {

                    finish(
                        new Error("Could not load audio file")
                    );
                }


                function handleProgress() {

                    if (typeof onProgress === "function") {
                        onProgress(audio);
                    }
                }


                audio.addEventListener(
                    "loadedmetadata",
                    handleMetadata
                );

                audio.addEventListener(
                    "canplaythrough",
                    handleLoaded
                );

                audio.addEventListener(
                    "error",
                    handleError
                );

                audio.addEventListener(
                    "progress",
                    handleProgress
                );


                /*
                 * Start loading only after all listeners
                 * have been attached.
                 */
                audio.src = getSongURL(filename);

                audio.load();

            });
        }


        /*
         * Download JSON.
         */
        function downloadJSON(data, filename) {

            const json = JSON.stringify(
                data,
                null,
                2
            );

            const blob = new Blob(
                [json],
                {
                    type: "application/json"
                }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = filename;

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 1000);
        }


        /*
         * Generate durations.json.
         */
        async function generateDurations() {

            generateButton.disabled = true;

            progress.style.display = "block";

            progressBar.style.width = "0%";

            status.className = "";


            try {

                status.textContent =
                    "Loading songs.json...";


                const songManifest =
                    await loadSongs();


                const total =
                    songManifest.length;


                status.textContent =
                    `Found ${total} songs.\n\nPreparing to load audio files...`;


                const songs = [];

                const failed = [];


                /*
                 * Process one song at a time.
                 */
                for (
                    let i = 0;
                    i < total;
                    i++
                ) {

                    const originalSong =
                        songManifest[i];

                    const file =
                        originalSong.file;

                    const name =
                        originalSong.name;


                    status.textContent =
                        `Song ${i + 1} of ${total}\n\n` +
                        `Loading audio file:\n${name}\n\n` +
                        `${file}\n\n` +
                        `Waiting for audio to load...`;


                    try {

                        const duration =
                            await getDuration(
                                file,
                                audio => {

                                    const percent =
                                        audio.duration > 0
                                            ? Math.round(
                                                (audio.buffered.length > 0
                                                    ? audio.buffered.end(
                                                        audio.buffered.length - 1
                                                    ) / audio.duration
                                                    : 0
                                                ) * 100
                                            )
                                            : 0;

                                    status.textContent =
                                        `Song ${i + 1} of ${total}\n\n` +
                                        `Loading:\n${name}\n\n` +
                                        `Audio loaded: ${percent}%`;
                                }
                            );


                        songs.push({
                            file,
                            name,
                            duration: Number(
                                duration.toFixed(3)
                            )
                        });


                    } catch (error) {

                        console.error(
                            `Failed to load ${file}:`,
                            error
                        );


                        songs.push({
                            file,
                            name,
                            duration: null,
                            error: true
                        });


                        failed.push({
                            name,
                            file,
                            reason: error.message
                        });
                    }


                    const percent =
                        ((i + 1) / total) * 100;


                    progressBar.style.width =
                        `${percent}%`;


                    status.textContent =
                        `Processed ${i + 1} of ${total} songs.\n\n` +
                        `Successful: ${songs.filter(song => song.duration !== null).length}\n` +
                        `Failed: ${failed.length}`;
                }


                /*
                 * Create the final durations.json.
                 */
                const output = {
                    songs
                };


                downloadJSON(
                    output,
                    "durations.json"
                );


                if (failed.length > 0) {

                    status.className = "error";

                    status.textContent =
                        `Finished with ${failed.length} failed song(s).\n\n` +
                        `Successfully loaded: ${songs.length - failed.length}\n` +
                        `Failed: ${failed.length}\n\n` +
                        `durations.json has been downloaded.\n\n` +
                        `Failed files:\n\n` +
                        failed.map(song =>
                            `${song.name}\n${song.file}\nReason: ${song.reason}`
                        ).join("\n\n");

                } else {

                    status.className = "success";

                    status.textContent =
                        `Successfully generated durations.json!\n\n` +
                        `${songs.length} songs processed.\n` +
                        `All audio files loaded successfully.\n\n` +
                        `The file has been downloaded.`;
                }


            } catch (error) {

                console.error(error);

                status.className = "error";

                status.textContent =
                    `Error:\n\n${error.message}`;
            }


            generateButton.disabled = false;
        }


        generateButton.addEventListener(
            "click",
            generateDurations
        );

    </script>

</body>

</html>
