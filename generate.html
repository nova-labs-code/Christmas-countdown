
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#12030a">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Christmas Radio Duration Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #12030a;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1d0710;
            border: 1px solid #4d1829;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .description {
            color: #c9aeb7;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px;
            background: #8b1e3f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a5264c;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #12030a;
            color: #d8c1c8;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #progress {
            width: 100%;
            height: 10px;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #35101d;
            display: none;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #b52b55;
            transition: width 0.15s ease;
        }

        #fileProgress {
            width: 100%;
            height: 7px;
            margin-top: 12px;
            border-radius: 10px;
            overflow: hidden;
            background: #35101d;
            display: none;
        }

        #fileProgressBar {
            width: 0%;
            height: 100%;
            background: #d45b7e;
            transition: width 0.15s ease;
        }

        .success {
            color: #8be28b !important;
        }

        .error {
            color: #ff8585 !important;
        }

        .muted {
            color: #c9aeb7;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Christmas Radio Duration Generator</h1>

        <div class="description">
            Loads songs from <strong>songs.json</strong>, downloads
            each MP3 from the <strong>songs</strong> folder, reads
            its duration, and downloads a new
            <strong>durations.json</strong>.
        </div>

        <button id="generateButton">
            Generate durations.json
        </button>

        <div id="progress">
            <div id="progressBar"></div>
        </div>

        <div id="fileProgress">
            <div id="fileProgressBar"></div>
        </div>

        <div id="status">
            Ready to load songs.json.
        </div>

        <div class="muted">
            Songs are downloaded and processed individually.
        </div>

    </div>

    <script>
        "use strict";

        const SONG_MANIFEST = "./songs.json";
        const SONG_FOLDER = "./songs/";

        const DOWNLOAD_TIMEOUT = 120000;
        const METADATA_TIMEOUT = 20000;

        const generateButton =
            document.getElementById("generateButton");

        const status =
            document.getElementById("status");

        const progress =
            document.getElementById("progress");

        const progressBar =
            document.getElementById("progressBar");

        const fileProgress =
            document.getElementById("fileProgress");

        const fileProgressBar =
            document.getElementById("fileProgressBar");


        /*
         * Load songs.json.
         *
         * Expected format:
         *
         * {
         *     "songs": [
         *         {
         *             "file": "Song File.mp3",
         *             "name": "Song Display Name"
         *         }
         *     ]
         * }
         */
        async function loadSongs() {

            const response = await fetch(
                SONG_MANIFEST,
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    `Could not load songs.json (${response.status})`
                );
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.songs)) {
                throw new Error(
                    "songs.json must contain a 'songs' array."
                );
            }

            const songs = data.songs
                .map(song => {

                    if (
                        !song ||
                        typeof song.file !== "string" ||
                        typeof song.name !== "string"
                    ) {
                        return null;
                    }

                    const file = song.file.trim();
                    const name = song.name.trim();

                    if (!file || !name) {
                        return null;
                    }

                    return {
                        file,
                        name
                    };
                })
                .filter(Boolean);

            if (songs.length === 0) {
                throw new Error(
                    "songs.json contains no valid songs."
                );
            }

            return songs;
        }


        /*
         * Build the MP3 URL.
         *
         * Uses the exact filename from songs.json.
         */
        function getSongURL(filename) {

            return (
                SONG_FOLDER +
                filename
                    .split("/")
                    .map(part => encodeURIComponent(part))
                    .join("/")
            );
        }


        /*
         * Download the entire MP3.
         *
         * This explicitly fetches the file rather than
         * relying on browser audio preloading.
         *
         * Once downloaded, the Blob is converted into
         * a temporary local URL for metadata reading.
         */
        async function getDuration(filename, onProgress) {

            const controller = new AbortController();

            let objectURL = null;
            let audio = null;

            let downloadTimeout;

            try {

                const url = getSongURL(filename);

                /*
                 * Timeout for downloading the MP3.
                 */
                downloadTimeout = setTimeout(() => {
                    controller.abort();
                }, DOWNLOAD_TIMEOUT);


                /*
                 * STEP 1:
                 * Download the actual MP3 file.
                 */
                const response = await fetch(
                    url,
                    {
                        cache: "no-store",
                        signal: controller.signal
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Download failed: HTTP ${response.status}`
                    );
                }


                /*
                 * STEP 2:
                 * Read the complete downloaded file.
                 */
                let blob;

                if (response.body && response.body.getReader) {

                    const reader = response.body.getReader();

                    const chunks = [];

                    const totalSize = Number(
                        response.headers.get("content-length")
                    ) || 0;

                    let receivedSize = 0;

                    while (true) {

                        const result = await reader.read();

                        if (result.done) {
                            break;
                        }

                        chunks.push(result.value);

                        receivedSize += result.value.length;

                        if (
                            typeof onProgress === "function"
                        ) {
                            onProgress({
                                loaded: receivedSize,
                                total: totalSize
                            });
                        }
                    }

                    blob = new Blob(
                        chunks,
                        {
                            type: "audio/mpeg"
                        }
                    );

                } else {

                    blob = await response.blob();

                    if (
                        typeof onProgress === "function"
                    ) {
                        onProgress({
                            loaded: blob.size,
                            total: blob.size
                        });
                    }
                }

                clearTimeout(downloadTimeout);


                if (!blob.size) {
                    throw new Error(
                        "Downloaded MP3 is empty."
                    );
                }


                /*
                 * STEP 3:
                 * Create a temporary local audio URL.
                 */
                objectURL = URL.createObjectURL(blob);

                audio = new Audio();

                audio.preload = "metadata";


                /*
                 * STEP 4:
                 * Wait for audio metadata.
                 */
                const duration = await new Promise(
                    (resolve, reject) => {

                        let finished = false;

                        const metadataTimeout = setTimeout(() => {
                            finish(
                                new Error(
                                    "Audio metadata loading timed out."
                                )
                            );
                        }, METADATA_TIMEOUT);


                        function cleanup() {

                            audio.removeEventListener(
                                "loadedmetadata",
                                handleMetadata
                            );

                            audio.removeEventListener(
                                "error",
                                handleError
                            );

                            clearTimeout(metadataTimeout);
                        }


                        function finish(error, value) {

                            if (finished) return;

                            finished = true;

                            cleanup();

                            if (error) {
                                reject(error);
                            } else {
                                resolve(value);
                            }
                        }


                        function handleMetadata() {

                            const value = audio.duration;

                            if (
                                !Number.isFinite(value) ||
                                value <= 0
                            ) {
                                finish(
                                    new Error(
                                        "Invalid audio duration."
                                    )
                                );

                                return;
                            }

                            finish(null, value);
                        }


                        function handleError() {

                            finish(
                                new Error(
                                    "Could not read audio metadata."
                                )
                            );
                        }


                        audio.addEventListener(
                            "loadedmetadata",
                            handleMetadata
                        );

                        audio.addEventListener(
                            "error",
                            handleError
                        );


                        /*
                         * Start reading the downloaded MP3.
                         */
                        audio.src = objectURL;

                        audio.load();
                    }
                );


                return duration;

            } catch (error) {

                if (error.name === "AbortError") {
                    throw new Error(
                        "MP3 download timed out."
                    );
                }

                throw error;

            } finally {

                clearTimeout(downloadTimeout);

                /*
                 * Release the temporary audio resources.
                 */
                if (audio) {
                    audio.pause();
                    audio.removeAttribute("src");
                    audio.load();
                }

                if (objectURL) {
                    URL.revokeObjectURL(objectURL);
                }
            }
        }


        /*
         * Download a JSON file.
         */
        function downloadJSON(data, filename) {

            const json = JSON.stringify(
                data,
                null,
                2
            );

            const blob = new Blob(
                [json],
                {
                    type: "application/json"
                }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = filename;

            document.body.appendChild(link);

            link.click();

            link.remove();

            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 1000);
        }


        /*
         * Generate durations.json.
         */
        async function generateDurations() {

            generateButton.disabled = true;

            progress.style.display = "block";
            fileProgress.style.display = "block";

            progressBar.style.width = "0%";
            fileProgressBar.style.width = "0%";

            status.className = "";


            try {

                status.textContent =
                    "Loading songs.json...";


                /*
                 * Load the playlist.
                 */
                const songManifest =
                    await loadSongs();

                const total =
                    songManifest.length;


                status.textContent =
                    `Found ${total} songs.\n\nPreparing to download audio files...`;


                const songs = [];
                const failed = [];


                /*
                 * Process one song at a time.
                 */
                for (
                    let i = 0;
                    i < total;
                    i++
                ) {

                    const originalSong =
                        songManifest[i];

                    const file =
                        originalSong.file;

                    const name =
                        originalSong.name;


                    fileProgressBar.style.width = "0%";


                    status.textContent =
                        `Song ${i + 1} of ${total}\n\n` +
                        `${name}\n\n` +
                        `Downloading MP3...`;


                    try {

                        const duration =
                            await getDuration(
                                file,
                                download => {

                                    let percent = 0;

                                    if (download.total > 0) {

                                        percent = Math.min(
                                            100,
                                            Math.round(
                                                download.loaded /
                                                download.total *
                                                100
                                            )
                                        );
                                    }

                                    fileProgressBar.style.width =
                                        `${percent}%`;


                                    const loadedMB =
                                        (
                                            download.loaded /
                                            1024 /
                                            1024
                                        ).toFixed(2);

                                    const totalMB =
                                        download.total > 0
                                            ? (
                                                download.total /
                                                1024 /
                                                1024
                                            ).toFixed(2)
                                            : "Unknown";


                                    status.textContent =
                                        `Song ${i + 1} of ${total}\n\n` +
                                        `${name}\n\n` +
                                        `Downloading MP3...\n` +
                                        `${percent}%\n` +
                                        `${loadedMB} MB / ${totalMB} MB`;
                                }
                            );


                        /*
                         * Save the successful duration.
                         */
                        songs.push({
                            file,
                            name,
                            duration: Number(
                                duration.toFixed(3)
                            )
                        });


                        fileProgressBar.style.width = "100%";


                    } catch (error) {

                        console.error(
                            `Failed to load ${file}:`,
                            error
                        );


                        songs.push({
                            file,
                            name,
                            duration: null,
                            error: true
                        });


                        failed.push({
                            name,
                            file,
                            reason: error.message
                        });
                    }


                    /*
                     * Update overall progress.
                     */
                    const percent =
                        ((i + 1) / total) * 100;

                    progressBar.style.width =
                        `${percent}%`;


                    const successful =
                        songs.filter(
                            song => song.duration !== null
                        ).length;


                    status.textContent =
                        `Processed ${i + 1} of ${total} songs.\n\n` +
                        `Successful: ${successful}\n` +
                        `Failed: ${failed.length}\n\n` +
                        `Last processed: ${name}`;
                }


                /*
                 * Create the final durations.json.
                 */
                const output = {
                    songs
                };


                downloadJSON(
                    output,
                    "durations.json"
                );


                /*
                 * Show final results.
                 */
                if (failed.length > 0) {

                    status.className = "error";

                    status.textContent =
                        `Finished with ${failed.length} failed song(s).\n\n` +
                        `Successful: ${songs.length - failed.length}\n` +
                        `Failed: ${failed.length}\n\n` +
                        `durations.json has been downloaded.\n\n` +
                        `Failed files:\n\n` +
                        failed.map(song =>
                            `${song.name}\n` +
                            `${song.file}\n` +
                            `Reason: ${song.reason}`
                        ).join("\n\n");

                } else {

                    status.className = "success";

                    status.textContent =
                        `Successfully generated durations.json!\n\n` +
                        `${songs.length} songs processed.\n` +
                        `All MP3 files downloaded successfully.\n\n` +
                        `The file has been downloaded.`;
                }


            } catch (error) {

                console.error(error);

                status.className = "error";

                status.textContent =
                    `Error:\n\n${error.message}`;
            }


            generateButton.disabled = false;
        }


        /*
         * Start generator.
         */
        generateButton.addEventListener(
            "click",
            generateDurations
        );

    </script>

</body>

</html>
